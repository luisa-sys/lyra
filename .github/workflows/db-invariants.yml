name: Database Security Invariants

# SEC-101 — the live backstop for Lyra's most recurrent security defect class.
#
# `scripts/check-migration-privileges.py` (in pr-checks.yml) holds every
# migration in a PR to the privilege rules. That is necessary but not
# sufficient: per CLAUDE.md, schema changes are applied with the Supabase MCP
# `apply_migration` tool, so DDL routinely reaches a database WITHOUT passing
# through a pull request. SEC-42 is exactly that — an `authenticated` EXECUTE
# grant restored by a later migration after SEC-29 had been closed and
# verified. No repo-side control could have seen it.
#
# This workflow asks each running database what its posture actually is.
#
# Runs daily and on demand — deliberately NOT on pull_request.
#
# This job asserts the state of the LIVE databases. A pull request cannot change
# that state (the migration reaches a database only after it is applied), so
# running it as a PR check would gate every PR on a condition no PR can satisfy
# — and the first response to an unsatisfiable required check is to disable it.
# That is how gates die.
#
# The checker's LOGIC is still exercised on every PR: pr-checks.yml runs
# `check-db-invariants.py --self-test` and `check-waiver-hygiene.py`, so a
# broken waiver/expiry rule or a rotted detector fails at PR time. What lives
# here is only the part that needs live credentials.
#
# Same "one concern, one owner" split the repo already uses for liveness
# (health-check.yml) vs everything that merely cites it (KAN-361).
#
# NOTE: until migration 20260727090000_security_invariants_report.sql is applied
# to dev, staging and production, every run reports UNVERIFIED and exits
# non-zero. That is intentional and is the nag — an unapplied backstop is not a
# healthy backstop, and it must not look like one.

on:
  schedule:
    # 06:15 UTC daily — after the 04:12 staging soak, before the 07:00 reports,
    # so a finding lands in the same morning's inbox.
    - cron: '15 6 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  invariants:
    name: Assert database security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Self-test the checker
        # If the waiver/expiry logic itself breaks, every environment would
        # report clean for the wrong reason. Prove the detector works before
        # trusting anything it says.
        run: |
          set -euo pipefail
          python3 scripts/check-db-invariants.py --self-test
          python3 scripts/check-waiver-hygiene.py --self-test

      - name: Assert required credentials are present
        # NO SILENT SKIP. A missing secret must fail loudly, never quietly
        # reduce coverage — that is the SEC-79 / KAN-167 failure mode, where
        # health-check.yml and weekly-report.yml sat disabled for weeks while
        # still reporting green.
        env:
          DEV_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DEV_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PROD_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          MISSING=""
          for v in DEV_URL DEV_KEY STAGING_URL STAGING_KEY PROD_URL PROD_KEY; do
            if [ -z "${!v:-}" ]; then MISSING="$MISSING $v"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secret(s):$MISSING"
            echo "::error::Refusing to run a partial check that would look like a clean pass."
            exit 1
          fi
          echo "All six environment credentials present."

      - name: Check dev / staging / production
        env:
          DEV_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/check-db-invariants.py

      - name: Raise the finding
        if: failure()
        run: |
          set -euo pipefail
          echo "::error::Database security invariants FAILED or could not be verified."
          echo ""
          echo "This is the SEC-12/15/27/28/29/42/43 + BUGS-48/65/69 family — a"
          echo "SECURITY DEFINER function or storage bucket reachable by a role that"
          echo "should not reach it. It has recurred nine times; treat a finding here"
          echo "as live exposure until proven otherwise."
          echo ""
          echo "1. Read the annotations above for the exact object and environment."
          echo "2. Fix forward with a NEW migration that REVOKEs — never by editing"
          echo "   an applied migration."
          echo "3. Raise a SEC ticket and record it in the Risk Register."
          echo "4. If the finding is accepted, add a waiver with an owner, a Jira key"
          echo "   and a date to supabase/security-invariants-waivers.json."

  snapshot-freshness:
    name: Committed schema snapshots match their databases (CTL-048, daily)
    # SEC-133 — CTL-048's live-vs-snapshot half, run DAILY.
    #
    # WHY A SEPARATE JOB, not another step on `invariants`: that job's
    # `if: failure()` handler prints a SECURITY DEFINER / storage-bucket
    # message. A stale snapshot is not that, and a finding that describes
    # itself wrongly is how an operator learns to skim the annotations.
    #
    # WHY DAILY AT ALL: CTL-048 previously ran only during a promote, so drift
    # could sit undetected indefinitely and then surface at the worst possible
    # moment — at the door of a release. SEC-131 was found only because someone
    # chose to dry-run the gate before dispatching; how long those two columns
    # had been missing is unknown, because nothing was looking.
    #
    # WHY ONLY THE SNAPSHOT HALF: the two halves behave oppositely during a
    # staged migration rollout, and rollouts here span days. live-vs-live
    # compares the three databases to each other, so mid-rollout it is red for
    # the whole window — noise, daily. live-vs-snapshot compares each env to its
    # OWN database and is unaffected, provided <env>.ts is regenerated when
    # <env> is migrated.
    #
    # And the evidence settles it: SEC-131 was INVISIBLE to live-vs-live,
    # because all three databases agreed perfectly. Only this half could see it.
    # Both halves still run on the promote; that path is unchanged.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Self-test the checker
        # Prove the comparators can still fail before trusting a clean report.
        # The six compare_snapshots() fixtures added under SEC-133 are the ones
        # that matter here — this job runs nothing else.
        run: python3 scripts/check-live-schema-parity.py --self-test

      - name: Compare each committed snapshot with its own database
        # Fail-closed on a missing credential: the script exits 2 and says which
        # one, rather than reporting a clean scan it never performed.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/check-live-schema-parity.py --snapshot-only

      # SEC-143 — the fourth snapshot, which lives in lyra-admin-mcp-server.
      #
      # DELIBERATELY A SEPARATE STEP, not a flag on the one above. The two
      # findings need OPPOSITE remedies: a stale local snapshot is fixed with
      # `npm run gen:db-types`, a stale admin contract is fixed by regenerating a
      # file in another repository. Sharing one `if: failure()` handler would
      # print the wrong instruction for whichever fired — which is precisely
      # CTL-059, fixed in this same workflow's ledger-parity job hours earlier.
      - name: Compare the admin server's schema contract with production (SEC-143)
        id: admin-contract
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          # ⚠️ CORRECTED 2026-08-16. This said "same mechanism CTL-043 uses for
          # its cross-repo reads — the built-in token, no new secret provisioned
          # anywhere", and that is why this step had never once succeeded.
          #
          # CTL-043's target (lyra-mcp-server) is PUBLIC, which is the whole
          # reason the built-in token reaches it — shared-code-manifest.json
          # records that precondition explicitly. lyra-admin-mcp-server is
          # PRIVATE, and a workflow's GITHUB_TOKEN is scoped to its own
          # repository, so it can never read it. The mechanism was copied
          # without the precondition that made it valid.
          #
          # ADMIN_CONTRACT_READ_TOKEN is the fix. Until it exists the step fails
          # closed and names the gap — which is honest, but is not the control
          # running. Tracked in SEC-150.
          GH_TOKEN: ${{ secrets.ADMIN_CONTRACT_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/check-live-schema-parity.py \
            --env prod --snapshot-only --with-admin-contract || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Raise the admin-contract finding
        if: failure() && steps.admin-contract.outcome == 'failure'
        env:
          RC: ${{ steps.admin-contract.outputs.rc }}
        run: |
          set -euo pipefail
          case "${RC:-unknown}" in
            2)
              echo "::error::The admin schema contract could not be READ or compared."
              echo ""
              echo "This is NOT a drift finding. Nothing was compared, so do not go"
              echo "looking for a stale column — the file could not be fetched, or the"
              echo "production database could not be read. Check gh auth and the"
              echo "PROD_SUPABASE_* secrets."
              ;;
            1)
              echo "::error::lyra-admin-mcp-server's schema contract no longer matches production."
              echo ""
              echo "That contract is what types the admin server's writes (BUGS-101). A"
              echo "column it declares but production lacks is the BUGS-101 shape itself:"
              echo "a write typed against a dropped column, failing at runtime with"
              echo "PGRST204. A column production has but the contract lacks means the"
              echo "contract has gone stale and is describing a database that moved."
              echo ""
              echo "Fix in lyra-admin-mcp-server, not here: regenerate"
              echo "src/types/database.ts from this repo's src/types/database/prod.ts"
              echo "(its header records the exact provenance and how to redo it)."
              ;;
            *)
              echo "::error::admin-contract step failed with rc='${RC:-unknown}'."
              echo "The guidance above does not apply — neither exit code was reported,"
              echo "so treat this as a broken step rather than a schema finding."
              ;;
          esac
          exit 1

      - name: Raise the finding
        if: failure() && steps.admin-contract.outcome != 'failure'
        run: |
          set -euo pipefail
          echo "::error::A committed schema snapshot no longer matches its own database."
          echo ""
          echo "src/types/database/ is what the app's \`Database\` type is built from,"
          echo "so a stale snapshot means the compiler is reasoning about a schema that"
          echo "does not exist. CTL-036 cannot see this: it compares the three snapshots"
          echo "to EACH OTHER, so three files stale in the same way look identical and"
          echo "pass. That is exactly how SEC-131 stayed green in every gate."
          echo ""
          echo "Fix, naming the environment the annotations above identify:"
          echo "    npm run gen:db-types -- --env dev"
          echo "then commit the regenerated file."
          echo ""
          echo "Full steps: docs/RUNBOOK.md -> 'Regenerating a database type snapshot'."
          echo ""
          echo "If this is red because a migration is mid-rollout, that is the control"
          echo "working: regenerate the snapshot for the environment you migrated. Do"
          echo "NOT leave it red across days — a red you learn to expect is a control"
          echo "you have switched off."

  ledger-parity:
    name: The repo can rebuild the schema (CTL-049, daily)
    # SEC-137 — the axis no other database control looks at.
    #
    # CTL-036 compares the three committed snapshots to each other. CTL-048
    # compares each live database to its own snapshot. `invariants` above asks
    # each database for its privilege posture. Every one of them asks "is the
    # schema RIGHT?" — and on 2026-08-12 all three were green and all three
    # were correct.
    #
    # None of them reads supabase/migrations/. So nothing asserted that the SQL
    # in the repo can REPRODUCE the databases, which is the only question that
    # matters the day one is lost. It cannot: mcp_tool_call_log and
    # content_moderation_flags are live tables on all three environments with
    # no migration SQL in version control, and production's ledger has no row
    # for create_lyra_schema.
    #
    # WHY A SEPARATE JOB: same reason snapshot-freshness is separate. The
    # `invariants` job's failure handler prints a SECURITY DEFINER message.
    # A finding that describes itself wrongly is how an operator learns to
    # skim the annotations.
    #
    # WHY NOT ON pull_request: a PR cannot change what a database has applied,
    # so gating every PR on it would be an unsatisfiable required check — and
    # the first response to one of those is to switch it off. The comparison
    # LOGIC is exercised on every PR via --self-test in pr-checks.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Self-test the checker
        # Prove the comparison and the two-way ratchet can still fail before
        # trusting anything this job says about live state.
        run: |
          set -euo pipefail
          python3 scripts/check-migration-ledger-parity.py --self-test

      - name: Assert the credential is present
        # NO SILENT SKIP (KAN-167). A missing token must fail loudly rather
        # than quietly reduce coverage — SEC-136 is a live example of the same
        # defect in this repo's own weekly audit.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            echo "::error::Refusing to run a check that would report clean without"
            echo "::error::having contacted a single database."
            exit 1
          fi
          echo "Management API token present."

      - name: Compare each ledger against supabase/migrations/
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Deliberately NOT --ledger-dir. That seam reads local files and exists
        # only for generating the first baseline; a control that can be handed
        # its own answer is a control that can be made to agree with anything.
        id: compare
        run: |
          set -euo pipefail
          # `|| rc=$?` rather than `set +e`: keeps the Workflow Integrity
          # Policy's `set -euo pipefail` in force for every OTHER line while
          # still capturing a non-zero exit instead of aborting on it.
          rc=0
          python3 scripts/check-migration-ledger-parity.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Raise the finding
        if: failure()
        # ⚠️ BRANCH ON THE EXIT CODE. This handler used to print the divergence
        # story on ANY non-zero, so an exit 2 — "could not read a ledger at
        # all" — rendered as exit 1, "a migration is missing from the repo".
        # Observed 2026-08-14: the dev project 403'd, and the annotation told
        # the reader to go and commit SQL that was never missing.
        #
        # A finding that describes itself wrongly is how an operator learns to
        # skim the annotations — the reason this job is separate from
        # `invariants` in the first place, per the comment at the top.
        env:
          RC: ${{ steps.compare.outputs.rc }}
        run: |
          set -euo pipefail
          case "${RC:-unknown}" in
            2)
              echo "::error::A ledger could not be READ. This is not a divergence finding."
              echo ""
              echo "The check failed closed: it could not contact one or more databases,"
              echo "so it refused to report agreement it had not verified. Nothing here"
              echo "says the repo and the databases disagree — only that the question"
              echo "could not be asked."
              echo ""
              echo "The annotation above names the project and the HTTP status, and"
              echo "carries the response BODY, which is what tells the two 403 sources"
              echo "apart:"
              echo ""
              echo "  an HTML challenge page  -> Cloudflare bot protection, which 403s"
              echo "      before Supabase sees the token. Usually transient; the"
              echo "      User-Agent header in the script exists for this."
              echo "  a JSON error            -> Supabase refusing the token's scope."
              echo "      Check SUPABASE_ACCESS_TOKEN has not expired or been narrowed"
              echo "      (SEC-139 tracks its 2027-08-13 expiry)."
              echo ""
              echo "Do NOT go looking for an uncommitted migration on the strength of"
              echo "this failure. Context: SEC-137."
              exit 0
              ;;
            1)
              : # fall through to the divergence text below
              ;;
            *)
              echo "::error::The ledger-parity check exited with an unexpected status: ${RC:-<none>}."
              echo ""
              echo "Exit 1 means a divergence was found; exit 2 means a ledger could not"
              echo "be read. Anything else means the step itself broke before it could"
              echo "report — a missing interpreter, a syntax error, a killed process."
              echo "Read the step log directly; the guidance below does not apply."
              echo ""
              echo "Context: SEC-137."
              exit 0
              ;;
          esac
          echo "::error::The repo and a database no longer agree about what has been applied."
          echo ""
          echo "Two shapes, and the annotations above say which:"
          echo ""
          echo "  NEW ... applied to the database but NOT in the repo"
          echo "      Someone applied SQL that was never committed. This is the"
          echo "      unrebuildable case: if that database were lost, this change"
          echo "      would not come back. Commit the migration SQL."
          echo ""
          echo "  NEW ... in the repo but NOT recorded as applied"
          echo "      A committed migration no ledger knows about. Either apply it,"
          echo "      or work out which ledger row it actually corresponds to."
          echo ""
          echo "  STALE ... baselined but no longer diverges"
          echo "      Something got FIXED without shrinking the baseline. Regenerate:"
          echo "          python3 scripts/check-migration-ledger-parity.py --write-baseline"
          echo "      This half is what stops the baseline becoming a suppression list."
          echo ""
          echo "The usual cause is CLAUDE.md gotcha #9: migrations are applied with the"
          echo "Supabase MCP apply_migration tool, which writes to the database and its"
          echo "ledger but does NOT write a file into the repo. Committing the SQL is a"
          echo "separate step, and a separate step is one that can be missed."
          echo ""
          echo "Context: SEC-137."

  snapshot-regeneration:
    name: Committed snapshots match a fresh generation (CTL-071, daily)
    # SEC-151 — the dimensions the other two snapshot controls cannot see.
    #
    # On 2026-08-16 all three committed snapshots were simultaneously wrong
    # about their own databases and BOTH existing controls were green:
    # `prompt_id` typed non-null where every environment has it nullable, the
    # `favourite_custom` enum member absent, and `public_profiles` carrying no
    # Insert/Update despite being an auto-updatable view.
    #
    # CTL-036 diffs the three snapshots against EACH OTHER, so uniform
    # staleness reads as zero drift. CTL-048 asks the databases but compares
    # column SETS — a column with the wrong nullability is still in the set, an
    # enum member is not a column, view updatability is not a column. Neither
    # was defective. There was simply no control on those dimensions.
    #
    # WHY A WHOLE-FILE DIFF rather than three new assertions: those three are
    # not a category, they are the three we happened to find. A control that
    # enumerates dimensions catches only the ones somebody thought of, and the
    # finding is precisely that nobody thought of these.
    #
    # WHY A SEPARATE JOB: same reason ledger-parity is separate. Each of these
    # jobs prints a different remediation, and a finding that describes itself
    # wrongly is how an operator learns to skim the annotations.
    #
    # WHY NOT ON pull_request: a PR cannot change what a database contains, so
    # gating every PR on it would be an unsatisfiable required check. The
    # comparison LOGIC is exercised on every PR via --self-test in
    # pr-checks.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Self-test the checker
        # Prove the comparison can still fail on each of the three dimensions
        # before trusting anything this job says about live state.
        run: |
          set -euo pipefail
          python3 scripts/check-snapshot-regeneration.py --self-test

      - name: Assert the credential is present
        # NO SILENT SKIP (KAN-167). A missing token must fail loudly rather
        # than quietly reduce coverage.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set."
            echo "::error::Refusing to run a check that would report clean without having"
            echo "::error::regenerated a single snapshot."
            exit 1
          fi
          echo "SUPABASE_ACCESS_TOKEN is present."

      - name: Regenerate each snapshot and diff it against the committed file
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Deliberately NOT --generated-dir. That seam reads local files and
        # exists only so the comparison can be proven without a CLI token; a
        # control that can be handed its own answer can be made to agree with
        # anything.
        id: compare
        run: |
          set -euo pipefail
          # `|| rc=$?` rather than `set +e`: keeps `set -euo pipefail` in force
          # for every other line while still capturing a non-zero exit.
          rc=0
          python3 scripts/check-snapshot-regeneration.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Raise the finding
        if: failure()
        # ⚠️ BRANCH ON THE EXIT CODE, for the reason the ledger-parity handler
        # above already learned the hard way: exit 2 ("could not generate") and
        # exit 1 ("the snapshot is stale") need opposite responses, and a
        # handler that prints the drift story on any non-zero sends the reader
        # to regenerate a file that was never wrong.
        env:
          RC: ${{ steps.compare.outputs.rc }}
        run: |
          set -euo pipefail
          case "${RC:-unknown}" in
            2)
              echo "::error::A snapshot could not be REGENERATED. This is not a drift finding."
              echo ""
              echo "The check failed closed: it could not produce a fresh snapshot for at"
              echo "least one environment, so it refused to report agreement it had not"
              echo "verified. Nothing here says a committed snapshot is wrong — only that"
              echo "the question could not be asked."
              echo ""
              echo "Usual causes, in order of likelihood:"
              echo "  * the npx install of the Supabase CLI failed (network, npm outage)"
              echo "  * SUPABASE_ACCESS_TOKEN expired or was narrowed (SEC-139 tracks its"
              echo "    2027-08-13 expiry)"
              echo "  * a project ref in src/types/database/index.ts no longer resolves"
              echo ""
              echo "Do NOT regenerate anything on the strength of this failure."
              echo "Context: SEC-151."
              exit 0
              ;;
            1)
              : # fall through to the drift text below
              ;;
            *)
              echo "::error::The snapshot-regeneration check exited with an unexpected status: ${RC:-<none>}."
              echo ""
              echo "Exit 1 means a snapshot has drifted; exit 2 means one could not be"
              echo "regenerated. Anything else means the step broke before it could"
              echo "report. Read the step log directly; the guidance below does not apply."
              echo ""
              echo "Context: SEC-151."
              exit 0
              ;;
          esac
          echo "::error::A committed schema snapshot no longer matches its own database."
          echo ""
          echo "The annotations above give the environment and the first differing lines,"
          echo "committed side and database side. Two causes, needing opposite responses:"
          echo ""
          echo "  1. THE SCHEMA CHANGED and the snapshot was not regenerated."
          echo "     This is the finding. Fix:"
          echo "         npm run gen:db-types -- --env <env>"
          echo "     then commit the regenerated file. Note the app compiles against"
          echo "     dev.ts, so a stale dev snapshot means TypeScript is asserting"
          echo "     guarantees the database does not actually make — a null arriving at"
          echo "     runtime that nothing in CI could see coming."
          echo ""
          echo "  2. THE GENERATOR CHANGED. gen-db-types.sh runs 'npx --yes supabase',"
          echo "     which is unpinned, so a CLI release can alter formatting with no"
          echo "     schema change at all. The tell is a diff that is purely cosmetic, or"
          echo "     one that hits all three environments at once. Same fix, but say so"
          echo "     in the commit message. Pinning the CLI is SEC-151's follow-up,"
          echo "     precisely because this ambiguity exists."
          echo ""
          echo "What this catches that CTL-036 and CTL-048 cannot: nullability, enum"
          echo "membership, view updatability — and any other dimension the generator"
          echo "expresses that nobody has thought to enumerate."
          echo ""
          echo "Context: SEC-151."
