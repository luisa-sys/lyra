name: Weekly Security Audit

# KAN-361 — Belt-and-braces only. This workflow is intentionally a thin
# dependency-vulnerability net (`npm audit`, fail on high/critical). It is NOT
# the authoritative security sweep: that is the **Daily Security routine**
# (docs/DAILY_SECURITY_CHECK.md), which owns the full pen-test / RLS / edge /
# MCP posture and files SEC tickets. Keep this workflow lean — do not grow it
# into a second security sweep; add new security coverage to the Daily Security
# routine instead. See docs/OPS_ROUTINES_CONTROL_ROOM.md for the owner map.

on:
  schedule:
    - cron: '0 7 * * 3'  # Wednesday 07:00 UTC
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Self-test the audit reader (CTL-050)
        # Prove the parser can still fail before trusting anything it says about
        # this run. SEC-136: it previously could not fail at all.
        run: |
          set -euo pipefail
          python3 scripts/audit-summary.py --self-test

      - name: Run npm audit
        id: audit
        run: |
          set -euo pipefail

          # SEC-136. Three defects lived in this block, all of the same family:
          #
          #  1. `> file 2>&1` merged npm's WARNINGS into the JSON. With --json
          #     npm writes the report to stdout and warnings to stderr, so any
          #     warning corrupted the document. stderr now goes to its own file
          #     and is printed on failure, where it usually explains the cause.
          #
          #  2. The counts were parsed by an inline heredoc whose `except:`
          #     printed `0`. That fed `if: … != '0'` on the only failing step,
          #     so a parse failure SKIPPED the failure and the workflow passed.
          #     Now audit-summary.py exits 2 and `set -e` stops the job.
          #
          #  3. `echo "exit_code=$?"` came AFTER `|| true`, so it recorded 0
          #     unconditionally — a field that always reads clean is worse than
          #     no field. npm's real status is captured before anything else
          #     touches `$?`.
          #
          # npm audit exits non-zero when it FINDS vulnerabilities, which is a
          # successful measurement, so a non-zero rc is not an error here. That
          # is exactly why the rc must not be conflated with "did it run" — the
          # report is the evidence, and audit-summary.py is what judges it.
          npm audit --json > /tmp/audit-results.json 2> /tmp/audit-stderr.log && rc=0 || rc=$?
          echo "npm_exit_code=$rc" >> $GITHUB_OUTPUT
          echo "npm audit exited $rc (non-zero simply means findings exist)"

          # Fails the job (exit 2) on an unreadable or non-report document.
          python3 scripts/audit-summary.py /tmp/audit-results.json \
            --stderr-log /tmp/audit-stderr.log | tee /tmp/audit-counts.txt

          # Counts come from the reader, never re-derived here.
          HIGH=$(grep '^high_critical=' /tmp/audit-counts.txt | cut -d= -f2)
          TOTAL=$(grep '^total=' /tmp/audit-counts.txt | cut -d= -f2)
          echo "high_critical_count=$HIGH" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL" >> $GITHUB_OUTPUT

      - name: Generate audit report
        id: report
        run: |
          set -euo pipefail
          python3 scripts/audit-to-email.py /tmp/audit-results.json > /tmp/audit-email.json
          echo "has_vulns=$(python3 -c "import json; d=json.load(open('/tmp/audit-email.json')); print('true' if d.get('has_vulnerabilities') else 'false')")" >> $GITHUB_OUTPUT

      - name: Output to step summary
        run: |
          set -euo pipefail
          echo "## 🔒 Weekly Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.audit.outputs.high_critical_count }}" != "0" ]; then
            echo "### ⚠️ High/Critical Vulnerabilities Found: ${{ steps.audit.outputs.high_critical_count }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ No high/critical vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total vulnerabilities:** ${{ steps.audit.outputs.total_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Include advisory details
          python3 -c "
          import json
          try:
              data = json.load(open('/tmp/audit-results.json'))
              vulns = data.get('vulnerabilities', {})
              if vulns:
                  print('| Package | Severity | Advisory | Fix |')
                  print('|---------|----------|----------|-----|')
                  for name, info in vulns.items():
                      severity = info.get('severity', 'unknown')
                      fix = info.get('fixAvailable', False)
                      fix_str = 'Yes' if fix else 'No'
                      via = info.get('via', [])
                      url = ''
                      for v in via:
                          if isinstance(v, dict):
                              url = v.get('url', '')
                              break
                      print(f'| {name} | {severity} | {url} | {fix_str} |')
          except Exception as e:
              print(f'Could not parse audit results: {e}')
          " >> $GITHUB_STEP_SUMMARY

      - name: Email vulnerability alert via Resend
        if: steps.report.outputs.has_vulns == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ]; then
            echo "⚠️ RESEND_API_KEY not configured — skipping email"
            exit 0
          fi

          # Remove the has_vulnerabilities flag before sending (not a Resend field)
          python3 -c "
          import json
          data = json.load(open('/tmp/audit-email.json'))
          data.pop('has_vulnerabilities', None)
          json.dump(data, open('/tmp/audit-email-send.json', 'w'))
          "

          RESPONSE=$(curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/audit-email-send.json)

          echo "Email response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Security alert emailed successfully"
          else
            echo "⚠️ Email send may have failed — check Resend dashboard"
          fi

      - name: Fail if high/critical vulnerabilities found
        if: steps.audit.outputs.high_critical_count != '0'
        run: |
          set -euo pipefail
          echo "❌ ${{ steps.audit.outputs.high_critical_count }} high/critical vulnerabilities detected"
          echo "Run 'npm audit' locally and fix before next deploy"
          exit 1
