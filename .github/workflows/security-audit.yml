name: Weekly Security Audit

# KAN-361 — Belt-and-braces only. This workflow is intentionally a thin
# dependency-vulnerability net (`npm audit`, fail on high/critical). It is NOT
# the authoritative security sweep: that is the **Daily Security routine**
# (docs/DAILY_SECURITY_CHECK.md), which owns the full pen-test / RLS / edge /
# MCP posture and files SEC tickets. Keep this workflow lean — do not grow it
# into a second security sweep; add new security coverage to the Daily Security
# routine instead. See docs/OPS_ROUTINES_CONTROL_ROOM.md for the owner map.

#
# SEC-197 / CTL-081 — this workflow ALSO carries the daily dependency-freshness
# report (`freshness` job below). It is the same concern — "are our external
# dependencies vulnerable or out of date?" — so it lives here rather than in a
# second workflow that would duplicate the checkout/setup and the
# dependency-advisory issue plumbing. The founder rule (2026-11-23) is in
# docs/DEPENDENCY_POLICY.md: vulnerable (any severity) or >90 days old with a
# newer release means upgrade on develop, or carry a dated waiver.

on:
  schedule:
    - cron: '0 7 * * 3'  # Wednesday 07:00 UTC — the weekly npm audit (job `audit`)
    - cron: '20 6 * * *'  # Daily 06:20 UTC — dependency freshness (job `freshness`, SEC-197)
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write # SEC-105: dev-tree findings are raised as a labelled issue, not just emailed

jobs:
  audit:
    # The weekly audit stays WEEKLY. The daily cron above exists for the
    # freshness job; without this guard the audit (and its email) would start
    # firing every day. Manual dispatch still runs both jobs.
    if: github.event_name != 'schedule' || github.event.schedule == '0 7 * * 3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Self-test the audit reader (CTL-050)
        # Prove the parser can still fail before trusting anything it says about
        # this run. SEC-136: it previously could not fail at all.
        run: |
          set -euo pipefail
          python3 scripts/audit-summary.py --self-test

      - name: Run npm audit
        id: audit
        run: |
          set -euo pipefail

          # SEC-136. Three defects lived in this block, all of the same family:
          #
          #  1. `> file 2>&1` merged npm's WARNINGS into the JSON. With --json
          #     npm writes the report to stdout and warnings to stderr, so any
          #     warning corrupted the document. stderr now goes to its own file
          #     and is printed on failure, where it usually explains the cause.
          #
          #  2. The counts were parsed by an inline heredoc whose `except:`
          #     printed `0`. That fed `if: … != '0'` on the only failing step,
          #     so a parse failure SKIPPED the failure and the workflow passed.
          #     Now audit-summary.py exits 2 and `set -e` stops the job.
          #
          #  3. `echo "exit_code=$?"` came AFTER `|| true`, so it recorded 0
          #     unconditionally — a field that always reads clean is worse than
          #     no field. npm's real status is captured before anything else
          #     touches `$?`.
          #
          # npm audit exits non-zero when it FINDS vulnerabilities, which is a
          # successful measurement, so a non-zero rc is not an error here. That
          # is exactly why the rc must not be conflated with "did it run" — the
          # report is the evidence, and audit-summary.py is what judges it.
          npm audit --json > /tmp/audit-results.json 2> /tmp/audit-stderr.log && rc=0 || rc=$?
          echo "npm_exit_code=$rc" >> $GITHUB_OUTPUT
          echo "npm audit exited $rc (non-zero simply means findings exist)"

          # Fails the job (exit 2) on an unreadable or non-report document.
          python3 scripts/audit-summary.py /tmp/audit-results.json \
            --stderr-log /tmp/audit-stderr.log | tee /tmp/audit-counts.txt

          # Counts come from the reader, never re-derived here.
          HIGH=$(grep '^high_critical=' /tmp/audit-counts.txt | cut -d= -f2)
          TOTAL=$(grep '^total=' /tmp/audit-counts.txt | cut -d= -f2)
          echo "high_critical_count=$HIGH" >> $GITHUB_OUTPUT
          echo "total_count=$TOTAL" >> $GITHUB_OUTPUT

      - name: Generate audit report
        id: report
        run: |
          set -euo pipefail
          python3 scripts/audit-to-email.py /tmp/audit-results.json > /tmp/audit-email.json
          echo "has_vulns=$(python3 -c "import json; d=json.load(open('/tmp/audit-email.json')); print('true' if d.get('has_vulnerabilities') else 'false')")" >> $GITHUB_OUTPUT

      - name: Output to step summary
        run: |
          set -euo pipefail
          echo "## 🔒 Weekly Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.audit.outputs.high_critical_count }}" != "0" ]; then
            echo "### ⚠️ High/Critical Vulnerabilities Found: ${{ steps.audit.outputs.high_critical_count }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ No high/critical vulnerabilities" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total vulnerabilities:** ${{ steps.audit.outputs.total_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Include advisory details
          python3 -c "
          import json
          try:
              data = json.load(open('/tmp/audit-results.json'))
              vulns = data.get('vulnerabilities', {})
              if vulns:
                  print('| Package | Severity | Advisory | Fix |')
                  print('|---------|----------|----------|-----|')
                  for name, info in vulns.items():
                      severity = info.get('severity', 'unknown')
                      fix = info.get('fixAvailable', False)
                      fix_str = 'Yes' if fix else 'No'
                      via = info.get('via', [])
                      url = ''
                      for v in via:
                          if isinstance(v, dict):
                              url = v.get('url', '')
                              break
                      print(f'| {name} | {severity} | {url} | {fix_str} |')
          except Exception as e:
              print(f'Could not parse audit results: {e}')
          " >> $GITHUB_STEP_SUMMARY

      - name: Email vulnerability alert via Resend
        if: steps.report.outputs.has_vulns == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ]; then
            echo "⚠️ RESEND_API_KEY not configured — skipping email"
            exit 0
          fi

          # Remove the has_vulnerabilities flag before sending (not a Resend field)
          python3 -c "
          import json
          data = json.load(open('/tmp/audit-email.json'))
          data.pop('has_vulnerabilities', None)
          json.dump(data, open('/tmp/audit-email-send.json', 'w'))
          "

          RESPONSE=$(curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/audit-email-send.json)

          echo "Email response: $RESPONSE"
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Security alert emailed successfully"
          else
            echo "⚠️ Email send may have failed — check Resend dashboard"
          fi

      # SEC-105. This weekly run is now the ONLY place the dev tree is audited,
      # because the blocking gate was scoped to the production tree. That makes
      # it the difference between "dev advisories are tracked" and "dev
      # advisories are ignored" — so it must leave something behind that
      # outlives a run log. An email is a notification; an issue is a work item.
      #
      # Also asserts that no waiver has gone stale. Only this run can: it audits
      # the FULL tree, so it is the one with complete information. The prod-tree
      # PR gate cannot see a dev-only advisory and so only warns.
      - name: Check waiver staleness against the full tree
        id: waivers
        continue-on-error: true # advisory: a stale waiver is tidy-up, not an outage. Recorded in the issue below.
        run: |
          set -euo pipefail
          python3 scripts/check-npm-audit-gate.py --scope full --report-only 2>&1 | tee /tmp/waiver-check.txt

      - name: Open or update the dependency-advisory issue
        if: steps.audit.outputs.high_critical_count != '0' || steps.waivers.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TITLE="Dependency advisories — full tree (weekly audit)"
          BODY_FILE=/tmp/audit-issue.md

          {
            echo "Raised automatically by \`security-audit.yml\`. **This does not block any release** —"
            echo "the blocking gate is prod-tree scoped and lives in \`pr-checks.yml\` (SEC-105)."
            echo
            echo "- **High/critical (full tree, incl. dev):** ${{ steps.audit.outputs.high_critical_count }}"
            echo "- **Total advisories:** ${{ steps.audit.outputs.total_count }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```'
            cat /tmp/waiver-check.txt 2>/dev/null || echo "(waiver check produced no output)"
            echo '```'
            echo
            echo "**Next step:** triage into a SEC ticket. This repo's Actions have no Jira"
            echo "credentials, so the issue is the handoff — the Daily Security routine picks it"
            echo "up. Do not close it by fixing only the prod tree; a dev-only advisory is real"
            echo "work, it simply is not a release blocker."
          } > "$BODY_FILE"

          # Idempotent via a deterministic title, matching anomaly-detect.yml:
          # one running issue per ongoing condition, not one per week.
          EXISTING="$(gh issue list --search "in:title \"$TITLE\"" --state open --label dependencies --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            echo "Opening new dependency-advisory issue"
            gh issue create --title "$TITLE" --label dependencies --body-file "$BODY_FILE"
          fi

      - name: Fail if high/critical vulnerabilities found
        if: steps.audit.outputs.high_critical_count != '0'
        run: |
          set -euo pipefail
          echo "❌ ${{ steps.audit.outputs.high_critical_count }} high/critical vulnerabilities detected (full tree)"
          echo "This blocks no release — the release gate is prod-tree scoped (SEC-105)."
          echo "A red scheduled run is the signal the routine watchdog reads; the issue"
          echo "opened above is the work item. Triage both."
          exit 1

  # SEC-197 / CTL-081 — daily dependency freshness. Measures the WHOLE tree:
  # every advisory at any severity (npm audit, full tree), every direct
  # dependency >90 days old with a newer release (npm registry `time`), and
  # every Node.js major pinned by `node-version:` in a workflow.
  #
  # Deliberately NOT a red-every-day job. Out-of-policy findings go into ONE
  # tracking issue (opened, updated, closed when clean) and the job stays green,
  # because a red you have learned to expect is a switched-off control
  # (CLAUDE.md catalogue #7) and it would also break CTL-072's freshness watch
  # on this workflow. The job DOES go red when:
  #   - a waiver has EXPIRED or is malformed (exit 1) — a decision falling due,
  #   - the measurement itself failed (exit 2) — never reported as clean.
  # The blocking half of this control is the --pr gate in pr-checks.yml, which
  # fires only on PRs that change package.json / package-lock.json.
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false # read-only job; issue writes go through GH_TOKEN below

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22, not the '20' used elsewhere: Node 20 is itself out of policy
          # under SEC-197 (no release since 2026-03-24), and a new job should
          # not add another out-of-policy pin. Moving the rest is the deps work.
          node-version: '22'

      - name: Self-test the freshness checker (CTL-081)
        run: |
          set -euo pipefail
          python3 scripts/check-dependency-freshness.py --self-test

      - name: Measure dependency freshness
        id: fresh
        run: |
          set -euo pipefail
          # npm audit reads package-lock.json; no install is needed for either feed.
          # --report-only: findings are reported (and filed below), not failed.
          # Expired/malformed waivers still exit 1 and a failed measurement exits 2,
          # so `set -e` stops the job on exactly those.
          python3 scripts/check-dependency-freshness.py --report --report-only \
            --markdown /tmp/freshness.md --github-output "$GITHUB_OUTPUT" \
            | tee /tmp/freshness.txt
          {
            echo "## Dependency freshness (SEC-197)"
            echo
            cat /tmp/freshness.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the dependency-freshness issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_OF_POLICY: ${{ steps.fresh.outputs.out_of_policy }}
          STALE: ${{ steps.fresh.outputs.stale }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Dependency freshness — out-of-policy dependencies (SEC-197)"
          if [ -z "$OUT_OF_POLICY" ] || [ -z "$STALE" ]; then
            echo "::error::freshness counts missing from the measure step — refusing to guess"
            exit 1
          fi
          {
            cat /tmp/freshness.md
            echo
            echo "- Run: $RUN_URL"
          } > /tmp/freshness-issue.md

          # One running issue per ongoing condition, matched on a deterministic
          # title — the same idempotency pattern as the weekly audit above.
          EXISTING="$(gh issue list --search "in:title \"$TITLE\"" --state open --label dependencies --json number --jq '.[0].number')"
          if [ "$OUT_OF_POLICY" = "0" ] && [ "$STALE" = "0" ]; then
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --body "All dependencies are within policy as of this run. Closing. $RUN_URL"
              gh issue close "$EXISTING"
            fi
            echo "All dependencies within policy."
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            echo "Updating issue #$EXISTING ($OUT_OF_POLICY out of policy, $STALE stale waiver(s))"
            gh issue edit "$EXISTING" --body-file /tmp/freshness-issue.md
          else
            echo "Opening the dependency-freshness issue"
            gh issue create --title "$TITLE" --label dependencies --body-file /tmp/freshness-issue.md
          fi
