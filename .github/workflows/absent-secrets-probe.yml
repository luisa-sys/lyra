        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Absent-secret ledger freshness"
            echo ""
            echo "Checked 7 entr(y/ies) from .github/absent-secrets.txt."
            echo ""
            echo "A green run means every recorded absence is still real."
          } >> "$GITHUB_STEP_SUMMARY"
