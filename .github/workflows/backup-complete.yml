name: Daily Complete Backup (encrypted, WORM)

# SEC-23 — closes the gaps the SEC-5 DR runbook surfaced:
#   * DAILY (not weekly) → RPO ≤ 24h for our own independent copy.
#   * COMPLETE logical dump: public + auth + storage + roles (the weekly
#     backup-database.yml is public-only, so it cannot restore user accounts).
#   * Supabase Storage object blobs synced separately.
#   * Cloudflare KV (waitlist) exported.
#   * ENCRYPTED with an age recipient whose PRIVATE key is held OFFLINE by the
#     founder (KAN-121: "encrypted with a key not stored alongside the backup").
#   * Uploaded to a WORM R2 bucket using a SEPARATE write-only credential
#     (KAN-121: "separate credentials stored outside the primary secret store"),
#     so a compromise of the day-to-day R2 key cannot delete the backups.
#
# Per the Workflow & Backup Integrity Policy, every critical step fails LOUD on
# missing secrets — a false-green backup is worse than a red one. Peripheral
# steps (storage/KV) fail loud ONLY when there is data to lose, and otherwise
# emit a ::warning:: and record the skip honestly in the run summary.

on:
  # ARMED (SEC-23). Commissioned + smoke-tested green on 2026-07-25: all 12
  # secrets provisioned, a full dispatch run captured public+auth+storage+roles
  # (roles=captured, auth_users>0) + waitlist KV (non-empty), age-encrypted, and
  # uploaded 6 objects to the lyra-backups-worm R2 bucket (Object Lock: 30 days).
  # Scheduled runs execute from the DEFAULT branch (main), so this fires only
  # once merged there. See docs/DISASTER_RECOVERY.md §8.
  schedule:
    - cron: '0 1 * * *'  # Daily 01:00 UTC
  workflow_dispatch:
    inputs:
      allow_empty_kv:
        description: 'Pass a 0-key Cloudflare KV (waitlist) export instead of failing — ONLY if the waitlist is genuinely empty.'
        type: boolean
        required: false
        default: false
      allow_skipped_roles:
        description: 'Pass even if pg_dumpall --roles-only was skipped (Supabase→Supabase restore only; a clean-room restore would have no roles).'
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  BACKUP_DIR: ./backups
  # Encryption writes into a SEPARATE tree so ONLY files we encrypted can ever be
  # uploaded — never the plaintext source, and never a source file that merely
  # happens to be named *.age (SEC-23 leak fix).
  BACKUP_ENC_DIR: ./backups-enc

jobs:
  complete-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-17 age
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
          age --version

      # ── 1. Complete logical dump (public + auth + storage + roles) ─────────
      - name: Complete database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          chmod +x scripts/backup-database-complete.sh
          ./scripts/backup-database-complete.sh "$BACKUP_DIR"

      # ── 2. Supabase Storage object blobs ───────────────────────────────────
      # Fail LOUD only if there are objects to lose and creds are missing.
      # When the bucket is empty (pre-launch) record the skip, do not fake it.
      - name: Back up Supabase Storage objects
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
          STORAGE_S3_KEY: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY }}
          STORAGE_S3_SECRET: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          OBJ_COUNT=$(psql "$SUPABASE_DB_URL" -X -t -A -c "SELECT count(*) FROM storage.objects" 2>/dev/null || echo "ERR")
          echo "storage.objects count: $OBJ_COUNT"

          if [ -z "${STORAGE_S3_ENDPOINT:-}" ] || [ -z "${STORAGE_S3_KEY:-}" ] || [ -z "${STORAGE_S3_SECRET:-}" ]; then
            if [ "$OBJ_COUNT" = "0" ]; then
              echo "::warning::Supabase Storage S3 creds not set, but the bucket is empty (0 objects) — recording skip. Provision SUPABASE_STORAGE_S3_* before launch (SEC-23)."
              echo "STORAGE_BACKUP=skipped:no-creds:empty-bucket" >> "$BACKUP_DIR/STORAGE_STATUS"
              exit 0
            fi
            echo "::error::storage.objects has $OBJ_COUNT object(s) but SUPABASE_STORAGE_S3_* creds are not set — those files would be lost on a restore. Provision the storage S3 access keys (SEC-23)."
            exit 1
          fi

          pip install awscli --quiet
          export AWS_ACCESS_KEY_ID="$STORAGE_S3_KEY"
          export AWS_SECRET_ACCESS_KEY="$STORAGE_S3_SECRET"
          mkdir -p "$BACKUP_DIR/storage"
          # Mirror EVERY bucket. `aws s3 sync <https endpoint>` is NOT a valid S3
          # source (SEC-23 fix) — list the buckets over the S3-compatible API,
          # then sync each s3://<bucket> individually.
          BUCKETS="$(aws s3 ls --endpoint-url "$STORAGE_S3_ENDPOINT" | awk '{print $NF}')"
          if [ -z "$BUCKETS" ]; then
            echo "::error::storage.objects reports $OBJ_COUNT object(s) but the S3 API listed no buckets — check SUPABASE_STORAGE_S3_ENDPOINT / creds."; exit 1
          fi
          for b in $BUCKETS; do
            echo "syncing bucket ${b} ..."
            aws s3 sync "s3://${b}" "$BACKUP_DIR/storage/${b}/" --endpoint-url "$STORAGE_S3_ENDPOINT" --no-progress
          done
          SYNCED=$(find "$BACKUP_DIR/storage" -type f | wc -l | tr -d ' ')
          # Completeness signal (SEC-23). The REAL misconfig guard is the
          # per-bucket `aws s3 sync` above: it fails LOUD under set -e on any
          # auth/endpoint error, so a silent 0-copy against a populated bucket
          # with valid creds cannot green here. We must NOT additionally hard-fail
          # on SYNCED < pre_count: a LIVE bucket churns — an object present at the
          # pre-sync count can be legitimately deleted before the sync (SYNCED <
          # pre_count) or added after (SYNCED > pre_count), and a hard fail there
          # false-REDs every nightly run that happens to race an upload/delete.
          # Re-read the count AFTER the sync and only WARN if fewer files were
          # mirrored than the bucket holds NOW (a just-added object the next daily
          # run will capture). An unreadable post-count is fatal (can't verify).
          POST_COUNT=$(psql "$SUPABASE_DB_URL" -X -t -A -c "SELECT count(*) FROM storage.objects" 2>/dev/null || echo "ERR")
          if [ "$POST_COUNT" = "ERR" ]; then
            echo "::error::could not read storage.objects count after sync — cannot verify the storage backup."; exit 1
          fi
          if [ "$SYNCED" -lt "$POST_COUNT" ]; then
            echo "::warning::storage mirrored $SYNCED file(s) but storage.objects now reports $POST_COUNT — likely an upload during the backup window; the next daily run captures it."
          fi
          echo "STORAGE_BACKUP=synced:${SYNCED}-files" >> "$BACKUP_DIR/STORAGE_STATUS"
          echo "✓ storage objects synced: ${SYNCED} file(s) (storage.objects now: ${POST_COUNT})"

      # ── 3. Cloudflare KV (waitlist / interest emails) ──────────────────────
      - name: Export Cloudflare KV namespace
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_KV_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          ALLOW_EMPTY_KV: ${{ github.event.inputs.allow_empty_kv }}
        run: |
          set -euo pipefail
          OUT="$BACKUP_DIR/cloudflare-kv-${CF_KV_NAMESPACE_ID:-unset}.json"
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ] || [ -z "${CF_KV_NAMESPACE_ID:-}" ]; then
            echo "::error::Cloudflare KV creds incomplete (CLOUDFLARE_KV_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_KV_NAMESPACE_ID) — cannot back up waitlist KV. The KV API token needs a SEPARATE KV:read scope (gotcha #13). See SEC-23."
            exit 1
          fi
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}"
          # Dump keys + each value to disk (no secrets/values interpolated into
          # any source string), then assemble one JSON document in python.
          WORK="$(mktemp -d)"; mkdir -p "$WORK/values"
          # SEC-23: paginate. CF KV list returns <=1000 keys per page plus a
          # result_info.cursor; without following it a waitlist >1000 entries is
          # silently truncated (green but partial). Loop until the cursor empties.
          : > "$WORK/keys.txt"
          CURSOR=""
          while :; do
            # -G + --data-urlencode so the cursor (base64-ish; may contain +,/,=)
            # is safely encoded rather than corrupting the query (SEC-23).
            if [ -n "$CURSOR" ]; then
              RESP="$(curl -fsS -G "${BASE}/keys" --data-urlencode "limit=1000" --data-urlencode "cursor=${CURSOR}" -H "Authorization: Bearer ${CF_API_TOKEN}")"
            else
              RESP="$(curl -fsS -G "${BASE}/keys" --data-urlencode "limit=1000" -H "Authorization: Bearer ${CF_API_TOKEN}")"
            fi
            printf '%s' "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(k['name']) for k in d.get('result',[])]" >> "$WORK/keys.txt"
            CURSOR="$(printf '%s' "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('result_info',{}).get('cursor','') or '')")"
            [ -n "$CURSOR" ] || break
          done
          N=0
          while IFS= read -r KEY; do
            [ -n "$KEY" ] || continue
            printf '%s' "$KEY" > "$WORK/values/$N.key"
            # URL-encode the key into the path — waitlist emails contain @ and can
            # contain + (aliases) and other URL-significant chars (SEC-23).
            KEY_ENC="$(printf '%s' "$KEY" | python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=""))')"
            if ! curl -fsS "${BASE}/values/${KEY_ENC}" -H "Authorization: Bearer ${CF_API_TOKEN}" -o "$WORK/values/$N.val"; then
              echo "::error::failed to fetch KV value for key $KEY"; exit 1
            fi
            N=$((N+1))
          done < "$WORK/keys.txt"
          WORK="$WORK" ALLOW_EMPTY_KV="${ALLOW_EMPTY_KV:-false}" python3 - "$OUT" <<'PYEOF'
          import json, os, sys, glob
          work = os.environ["WORK"]
          doc = {"keys": [], "values": {}}
          for keyfile in sorted(glob.glob(os.path.join(work, "values", "*.key"))):
              with open(keyfile) as f: k = f.read()
              with open(keyfile[:-4] + ".val") as f: v = f.read()
              doc["keys"].append(k); doc["values"][k] = v
          # SEC-23 false-green gate: a valid token+namespace can return HTTP 200
          # with zero keys, greening a waitlist backup that contains nothing.
          # (`curl -fsS` already fails a wrong/forbidden namespace with a 4xx;
          # this catches the residual "valid but empty / valid-but-wrong-empty
          # namespace" case.) Hard-fail unless the operator deliberately allows
          # an empty waitlist via the allow_empty_kv dispatch input.
          if not doc["keys"] and os.environ.get("ALLOW_EMPTY_KV") != "true":
              print("::error::Cloudflare KV export returned 0 keys for this namespace. The waitlist is not expected to be empty — suspect the wrong CLOUDFLARE_KV_NAMESPACE_ID or a token missing the KV:read scope (gotcha #13). If the waitlist is genuinely empty, re-dispatch with allow_empty_kv=true.")
              sys.exit(1)
          json.dump(doc, open(sys.argv[1], "w"))
          print(f"✓ KV exported: {len(doc['keys'])} key(s)")
          PYEOF
          rm -rf "$WORK"

      # ── 4. Integrity gate (validate PLAINTEXT before encrypting/uploading) ──
      - name: Verify complete-backup integrity
        env:
          BACKUP_ALLOW_SKIPPED_ROLES: ${{ github.event.inputs.allow_skipped_roles }}
        run: |
          set -euo pipefail
          echo "## Complete Backup Integrity" >> "$GITHUB_STEP_SUMMARY"
          chmod +x scripts/check-complete-backup.sh
          if scripts/check-complete-backup.sh "$BACKUP_DIR" | tee -a "$GITHUB_STEP_SUMMARY"; then
            echo "✅ integrity gate passed"
          else
            echo "::error::complete-backup integrity gate FAILED — encryption + WORM upload skipped"
            exit 1
          fi

      # ── 5. Encrypt every artifact (auth dump contains password hashes!) ────
      - name: Encrypt artifacts with age
        env:
          BACKUP_AGE_RECIPIENTS: ${{ secrets.BACKUP_AGE_RECIPIENTS }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_AGE_RECIPIENTS:-}" ]; then
            echo "::error::BACKUP_AGE_RECIPIENTS not set. The complete dump contains auth password hashes and tokens and MUST NOT be uploaded unencrypted. Generate an age key pair, keep the PRIVATE key offline (break-glass), set the PUBLIC recipient as BACKUP_AGE_RECIPIENTS. See SEC-23 / KAN-121."
            exit 1
          fi
          # Support one OR MORE whitespace-separated recipients (multiple
          # break-glass holders): build a -r flag per recipient. `age -r "a b"`
          # would treat the whole string as one malformed recipient and abort.
          RCPT=()
          for r in $BACKUP_AGE_RECIPIENTS; do RCPT+=( -r "$r" ); done
          if [ "${#RCPT[@]}" -eq 0 ]; then
            echo "::error::BACKUP_AGE_RECIPIENTS contained no valid recipient"; exit 1
          fi
          # Encrypt EVERY file at ANY depth into a SEPARATE tree (SEC-23). We do
          # NOT trust the source extension: a nested storage blob (backups/storage/
          # <bucket>/foo.jpg) must be encrypted, and a storage object literally
          # named foo.age must NOT be passed through in cleartext. Encrypting into
          # $BACKUP_ENC_DIR (which the upload steps read) guarantees only encrypted
          # bytes can leave CI regardless of source names/depth.
          rm -rf "$BACKUP_ENC_DIR"; mkdir -p "$BACKUP_ENC_DIR"
          COUNT=0
          while IFS= read -r -d '' f; do
            REL="${f#"$BACKUP_DIR"/}"
            mkdir -p "$BACKUP_ENC_DIR/$(dirname "$REL")"
            age "${RCPT[@]}" -o "$BACKUP_ENC_DIR/${REL}.age" "$f"
            COUNT=$((COUNT+1))
          done < <(find "$BACKUP_DIR" -type f -print0)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no files found to encrypt in $BACKUP_DIR"; exit 1
          fi
          # Plaintext never leaves this job: drop the entire plaintext tree.
          rm -rf "$BACKUP_DIR"
          echo "✓ encrypted $COUNT file(s) to $BACKUP_ENC_DIR for ${#RCPT[@]} recipient(s); plaintext tree removed"

      # ── 6. GitHub artifact (encrypted) — forensics / second copy ───────────
      # SEC-23 leak fix: this step previously ran `if: always()` on `path:
      # backups/`, so a FAILED encrypt step (step 5 aborts under set -e, leaving
      # PLAINTEXT in backups/ — the auth dump = password hashes + refresh tokens)
      # would still publish that plaintext as a 90-day artifact. Two independent
      # guards now make that impossible: (a) `if: success()` so a failed
      # integrity-gate/encrypt short-circuits the upload entirely, and (b) the
      # path is restricted to `*.age` so ONLY encrypted files can ever leave CI,
      # even if the `if:` were changed. Belt-and-braces per KAN-121.
      - name: Upload encrypted artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: lyra-complete-backup-${{ github.run_id }}
          # Only the encrypted tree — the plaintext $BACKUP_DIR was removed after
          # encryption, and this path matches nothing else. `error` if empty so a
          # silent no-op upload can never masquerade as a backup.
          path: backups-enc/**/*.age
          if-no-files-found: error
          retention-days: 90

      # ── 7. WORM upload via SEPARATE write-only credential ──────────────────
      - name: Upload to R2 WORM (write-only credential)
        if: success()
        env:
          R2_KEY: ${{ secrets.R2_BACKUP_WRITEONLY_ACCESS_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_BACKUP_WRITEONLY_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_BACKUP_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${R2_KEY:-}" ] || [ -z "${R2_SECRET:-}" ] || [ -z "${R2_ENDPOINT:-}" ] || [ -z "${R2_BUCKET:-}" ]; then
            echo "::error::R2 WORM write-only creds incomplete (R2_BACKUP_WRITEONLY_ACCESS_KEY_ID / _SECRET_ACCESS_KEY / R2_BACKUP_ENDPOINT / R2_BACKUP_BUCKET). This MUST be a SEPARATE key from the day-to-day R2 key, scoped write-only (no Delete) against a bucket with Object Lock in COMPLIANCE retention. See SEC-23."
            exit 1
          fi
          pip install awscli --quiet
          export AWS_ACCESS_KEY_ID="$R2_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET"
          DATE=$(date -u +%Y-%m-%dT%H%M%SZ)
          UPLOAD_FAILED=0
          shopt -s globstar nullglob
          UPLOADED=0
          for f in "$BACKUP_ENC_DIR"/**/*.age; do
            REL="${f#"$BACKUP_ENC_DIR"/}"
            UPLOADED=$((UPLOADED+1))
            echo "Uploading complete/${DATE}/${REL} ..."
            if OUT=$(aws s3 cp "$f" "s3://${R2_BUCKET}/complete/${DATE}/${REL}" --endpoint-url "$R2_ENDPOINT" --no-progress 2>&1); then
              echo "  ✓ ${REL}"
            elif echo "$OUT" | grep -q "ObjectLockedByBucketPolicy\|already exists"; then
              echo "::warning::${REL} already exists under object lock (expected on same-day re-runs)"
            else
              echo "::error::${REL} upload failed: $OUT"; UPLOAD_FAILED=1
            fi
          done
          if [ "$UPLOADED" -eq 0 ]; then
            echo "::error::no encrypted (.age) files found to upload to R2 — the encrypt step produced nothing"; exit 1
          fi
          [ "$UPLOAD_FAILED" -eq 0 ] || { echo "::error::at least one WORM upload failed"; exit 1; }
          echo "✅ complete backup uploaded to R2 WORM: ${UPLOADED} object(s) under complete/${DATE}/"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Daily Complete Backup Summary"
            echo ""
            echo "| Asset | Size |"
            echo "|-------|------|"
            shopt -s globstar nullglob
            # On success the plaintext $BACKUP_DIR is gone and only the encrypted
            # tree remains; on an early failure the plaintext tree may still be
            # present. List whichever exists (this step is if: always()).
            for f in "$BACKUP_DIR"/**/* "$BACKUP_ENC_DIR"/**/*; do
              [ -f "$f" ] || continue
              echo "| ${f#./} | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
