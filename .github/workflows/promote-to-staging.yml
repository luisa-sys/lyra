name: Promote to Staging
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm'
        required: true

permissions:
  contents: write
  actions: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

defaults:
  run:
    shell: bash

jobs:
  verify-source:
    name: Verify develop pipeline passed at HEAD
    runs-on: ubuntu-latest
    outputs:
      develop_sha: ${{ steps.check.outputs.develop_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 1
          ref: develop
      - name: Check dev CI passed at develop HEAD (BUGS-4 fix)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "promote" ]; then
            echo "::error::You must type 'promote' to confirm"
            exit 1
          fi

          DEVELOP_SHA=$(git rev-parse HEAD)
          echo "develop HEAD: $DEVELOP_SHA"
          echo "develop_sha=$DEVELOP_SHA" >> "$GITHUB_OUTPUT"

          # BUGS-4: filter by headSha so we cannot match a stale run from a
          # previous (since-superseded) commit. The previous code took
          # --limit 1 unconditionally, which means a green run for an OLD
          # commit could mask CI failures or non-runs for the current HEAD.
          # BUGS-20 (2026-05-17): budget raised 10→30 attempts. Dev CI
          # takes 3–5 minutes; the prior 10×15s = 150s budget was tight
          # enough to time out same-day promotes. 30×15s = 7.5 min is
          # comfortable. Mirror of the fix on promote-to-production.yml.
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            RUN_INFO=$(gh run list \
              --repo "${{ github.repository }}" \
              --branch develop \
              --workflow deploy-dev.yml \
              --limit 10 \
              --json status,conclusion,headSha,databaseId \
              | python3 -c "
          import json, sys
          target = '$DEVELOP_SHA'
          runs = json.load(sys.stdin)
          for r in runs:
              if r['headSha'] == target:
                  print(f\"{r['status']}|{r['conclusion'] or 'pending'}|{r['databaseId']}\")
                  break
          else:
              print('NONE||')
          ")
            STATUS=$(echo "$RUN_INFO" | cut -d'|' -f1)
            CONCLUSION=$(echo "$RUN_INFO" | cut -d'|' -f2)
            RUN_ID=$(echo "$RUN_INFO" | cut -d'|' -f3)

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: dev CI for ${DEVELOP_SHA:0:8} = $STATUS / $CONCLUSION"

            if [ "$STATUS" = "NONE" ]; then
              echo "  No deploy-dev run for SHA ${DEVELOP_SHA:0:8} yet"
            elif [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              echo "::notice::Dev CI verified for ${DEVELOP_SHA:0:8} (run $RUN_ID)"
              exit 0
            elif [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              echo "::error::Dev CI for ${DEVELOP_SHA:0:8} concluded $CONCLUSION (run $RUN_ID). Fix before promoting."
              exit 1
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              sleep 15
            fi
          done
          echo "::error::Could not verify dev CI for ${DEVELOP_SHA:0:8} after $MAX_ATTEMPTS attempts."
          echo "::error::Either dev CI hasn't run for this commit yet, or there's a CI delay. Re-trigger shortly."
          exit 1

  signup-gate:
    # KAN-413 — the UN-SKIPPABLE sign-up gate. If the develop→staging diff touches
    # the sign-up surface (.github/signup-surface.paths), the real signup E2E must
    # run and pass before we promote; if it does not touch that surface, this is a
    # cheap no-op. Fail-closed: an unverifiable diff/manifest blocks the promotion.
    #
    # Enforcement is controlled by the repo variable SIGNUP_GATE_ENFORCE:
    #   'block' — a failed/absent signup E2E FAILS this job (blocks the promote).
    #   'warn'  — (default, bring-up) annotate but do not block. Flip to 'block'
    #             once the signup E2E has one green validation run on e2e-dev.
    # See docs/SIGNUP_SURFACE_GATE.md.
    name: Un-skippable sign-up E2E (when signup surface touched)
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: signup-e2e-${{ needs.verify-source.outputs.develop_sha }}
      cancel-in-progress: false
    env:
      CI: 'true'
      SIGNUP_E2E: '1'
      # e2e-dev is the DNS-only (grey-cloud) alias of the develop deploy — it
      # bypasses CF bot-management on the runner IP (gotcha #7) while staying a
      # .checklyra.com subdomain so the session cookie is valid. See
      # docs/E2E_AUTHED_CF_BYPASS.md. Overridable via vars.SIGNUP_E2E_BASE_URL.
      BASE_URL: ${{ vars.SIGNUP_E2E_BASE_URL || 'https://e2e-dev.checklyra.com' }}
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
      E2E_CF_BYPASS_HEADER: ${{ secrets.E2E_CF_BYPASS_HEADER }}
      E2E_CF_BYPASS_SECRET: ${{ secrets.E2E_CF_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          ref: develop
      - name: Detect sign-up surface changes (fail-closed)
        id: detect
        run: |
          set -uo pipefail
          git fetch origin staging develop --quiet || true
          set +e
          bash scripts/check-signup-surface-gate.sh origin/staging origin/develop
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sign-up surface CLEAN — signup E2E not required for this promotion."
          elif [ "$code" = "10" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "::warning::sign-up surface TOUCHED — running the un-skippable signup E2E."
          else
            echo "::error::signup gate could not verify the changed set/manifest — fail-closed, blocking promotion."
            exit 1
          fi
      - name: Prod guard (defence-in-depth)
        if: steps.detect.outputs.touched == 'true'
        run: |
          case "${E2E_SUPABASE_URL:-}" in
            *llzkgprqewuwkiwclowi*) echo "::error::refusing to run signup E2E against prod Supabase"; exit 1 ;;
          esac
          case "$BASE_URL" in
            *//checklyra.com*|*//beta.checklyra.com*) echo "::error::signup E2E must target dev/staging, not prod family"; exit 1 ;;
          esac
          echo "prod guard passed"
      - name: Setup Node.js
        if: steps.detect.outputs.touched == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        if: steps.detect.outputs.touched == 'true'
        run: npm ci
      - name: Install Playwright browsers
        if: steps.detect.outputs.touched == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run the un-skippable signup E2E
        if: steps.detect.outputs.touched == 'true'
        id: run
        # continue-on-error is intentional + advisory here: the next step
        # ("Enforce gate result") reads steps.run.outcome and FAILS the job in
        # block mode. Swallowing here only defers the decision one step so the
        # warn/block policy (vars.SIGNUP_GATE_ENFORCE) can be applied — it is
        # never a silent pass (Workflow & Backup Integrity Policy / KAN-167).
        continue-on-error: true
        run: |
          if [ -z "${E2E_SUPABASE_URL:-}" ] || [ -z "${E2E_SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::signup surface touched but E2E_SUPABASE_* secrets are not provisioned — cannot prove signup works."
            exit 78
          fi
          npx playwright test --project=signup-e2e
      - name: Enforce gate result
        if: steps.detect.outputs.touched == 'true'
        run: |
          ENFORCE="${{ vars.SIGNUP_GATE_ENFORCE || 'warn' }}"
          OUTCOME="${{ steps.run.outcome }}"
          echo "signup E2E outcome=$OUTCOME · enforcement=$ENFORCE"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice::signup E2E PASSED — promotion may proceed."
            exit 0
          fi
          if [ "$ENFORCE" = "block" ]; then
            echo "::error::signup surface changed and the signup E2E did not pass — SIGNUP_GATE_ENFORCE=block, promotion BLOCKED."
            exit 1
          fi
          echo "::warning::signup surface changed and the signup E2E did not pass, but SIGNUP_GATE_ENFORCE=warn — NOT blocking. Validate the signup E2E on e2e-dev, then set repo variable SIGNUP_GATE_ENFORCE=block to make it un-skippable."
          exit 0
      - name: Upload Playwright report
        if: always() && steps.detect.outputs.touched == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-signup
          path: |
            playwright-report/
            !tests/e2e/.auth/
          retention-days: 14

  merge-and-deploy:
    name: Merge develop → staging
    needs: [verify-source, signup-gate]
    runs-on: ubuntu-latest
    outputs:
      merged_sha: ${{ steps.merge.outputs.merged_sha }}
    steps:
      # BUGS-4: use LYRA_RELEASE_PAT instead of GITHUB_TOKEN. The
      # GITHUB_TOKEN does not trigger downstream workflows on push (per
      # https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication
      # — "events triggered by the GITHUB_TOKEN will not create a new
      # workflow run"). The PAT is attributed to a real user and DOES
      # trigger deploy-staging.yml on push.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.LYRA_RELEASE_PAT }}
      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Merge develop into staging
        id: merge
        run: |
          set -euo pipefail
          git checkout staging
          git pull origin staging --ff-only
          git merge origin/develop -m "Promote develop → staging [workflow_dispatch]"
          MERGED_SHA=$(git rev-parse HEAD)
          echo "merged_sha=$MERGED_SHA" >> "$GITHUB_OUTPUT"
          echo "Pushing staging at SHA $MERGED_SHA..."
          git push origin staging
          echo "::notice::Pushed staging at $MERGED_SHA. deploy-staging.yml should trigger now."

  wait-for-deploy:
    name: Wait for staging deploy (SHA-matched)
    needs: merge-and-deploy
    runs-on: ubuntu-latest
    steps:
      # BUGS-4: filter gh run list by headSha == merged SHA so we cannot
      # match a stale run from a previous deploy. The previous code used
      # --limit 1 unconditionally, which matched 32-day-old runs.
      - name: Wait for deploy-staging.yml run for our SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.merge-and-deploy.outputs.merged_sha }}
        run: |
          set -euo pipefail
          echo "Waiting for deploy-staging.yml run with headSha=$EXPECTED_SHA..."
          TIMEOUT=420
          ELAPSED=0
          INTERVAL=20
          while [ $ELAPSED -lt $TIMEOUT ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            RUN_INFO=$(gh run list \
              --repo "${{ github.repository }}" \
              --branch staging \
              --workflow deploy-staging.yml \
              --limit 5 \
              --json status,conclusion,headSha,databaseId,createdAt \
              | python3 -c "
          import json, sys
          target = '$EXPECTED_SHA'
          runs = json.load(sys.stdin)
          for r in runs:
              if r['headSha'] == target:
                  print(f\"{r['status']}|{r['conclusion'] or 'pending'}|{r['databaseId']}\")
                  break
          else:
              print('NONE||')
          ")
            STATUS=$(echo "$RUN_INFO" | cut -d'|' -f1)
            CONCLUSION=$(echo "$RUN_INFO" | cut -d'|' -f2)
            RUN_ID=$(echo "$RUN_INFO" | cut -d'|' -f3)

            if [ "$STATUS" = "NONE" ]; then
              echo "  No deploy-staging run for SHA ${EXPECTED_SHA:0:8} yet ($ELAPSED/${TIMEOUT}s)"
              continue
            fi

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "::notice::deploy-staging run $RUN_ID succeeded for SHA ${EXPECTED_SHA:0:8}"
                exit 0
              else
                echo "::error::deploy-staging run $RUN_ID FAILED ($CONCLUSION) for SHA ${EXPECTED_SHA:0:8}"
                exit 1
              fi
            fi

            echo "  deploy-staging run $RUN_ID is $STATUS for SHA ${EXPECTED_SHA:0:8} ($ELAPSED/${TIMEOUT}s)"
          done

          echo "::error::deploy-staging.yml never produced a run for SHA ${EXPECTED_SHA:0:8} after ${TIMEOUT}s"
          echo "::error::This usually means the merge push did not trigger downstream workflows."
          echo "::error::Check that LYRA_RELEASE_PAT is set and the merge job uses it (not GITHUB_TOKEN)."
          exit 1

  post-deploy-health:
    name: Verify staging actually serving merged SHA
    needs: [merge-and-deploy, wait-for-deploy]
    runs-on: ubuntu-latest
    steps:
      # BUGS-4: query Vercel API for the latest staging deployment and
      # compare its SHA to our merged SHA. The previous health check
      # accepted HTTP 401 (Vercel SSO) as success — but 401 is returned
      # regardless of which build is deployed, so it tells us nothing.
      - name: Verify Vercel deployed our SHA to staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPECTED_SHA: ${{ needs.merge-and-deploy.outputs.merged_sha }}
        run: |
          set -euo pipefail
          # Query the Vercel REST API for recent deployments on this project,
          # filter for staging-target, and verify the most recent has our SHA.
          # Retry briefly because Vercel may take ~30s to register the deploy
          # after deploy-staging.yml completes.
          MAX_ATTEMPTS=6
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            DEPLOY_INFO=$(curl -sf \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=staging&limit=5" \
              | python3 -c "
          import json, sys
          target = '$EXPECTED_SHA'
          data = json.load(sys.stdin)
          for d in data.get('deployments', []):
              meta = d.get('meta', {}) or {}
              sha = meta.get('githubCommitSha') or ''
              if sha == target:
                  print(f\"{d.get('uid')}|{d.get('readyState')}|{sha}\")
                  break
          else:
              print('NONE||')
          ")
            DEPLOY_UID=$(echo "$DEPLOY_INFO" | cut -d'|' -f1)
            STATE=$(echo "$DEPLOY_INFO" | cut -d'|' -f2)

            if [ "$DEPLOY_UID" = "NONE" ]; then
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: no Vercel deployment for SHA ${EXPECTED_SHA:0:8} yet"
              [ $ATTEMPT -lt $MAX_ATTEMPTS ] && sleep 15 && continue
              echo "::error::Vercel has no staging deployment for SHA ${EXPECTED_SHA:0:8}"
              exit 1
            fi

            if [ "$STATE" = "READY" ]; then
              echo "::notice::Vercel deployment $DEPLOY_UID for SHA ${EXPECTED_SHA:0:8} is READY"
              break
            fi

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: deployment $DEPLOY_UID is $STATE"
            [ $ATTEMPT -lt $MAX_ATTEMPTS ] && sleep 15
          done

          if [ "$STATE" != "READY" ]; then
            echo "::error::Vercel deployment $DEPLOY_UID never reached READY state ($STATE)"
            exit 1
          fi

      - name: Health check — staging endpoint reachable
        run: |
          set -euo pipefail
          STATUS=$(curl -so /dev/null -w "%{http_code}" --max-time 15 "https://stage.checklyra.com")
          # 200 = served (would need bypass to see actual content)
          # 401 = Vercel SSO gate (expected for staging)
          # 403 = Cloudflare bot challenge (acceptable for CI)
          # Any 5xx = real failure
          case "$STATUS" in
            200|401|403)
              echo "::notice::stage.checklyra.com responded $STATUS (gate or content)"
              ;;
            *)
              echo "::error::stage.checklyra.com unreachable: $STATUS"
              exit 1
              ;;
          esac
      - name: Health check — MCP server
        run: |
          set -euo pipefail
          STATUS=$(curl -so /dev/null -w "%{http_code}" --max-time 15 "https://mcp.checklyra.com/health")
          case "$STATUS" in
            200|403)
              echo "::notice::MCP server responded $STATUS"
              ;;
            *)
              echo "::error::MCP server unreachable: $STATUS"
              exit 1
              ;;
          esac
      - name: Summary
        env:
          EXPECTED_SHA: ${{ needs.merge-and-deploy.outputs.merged_sha }}
        run: |
          {
            echo "## ✅ Staging Promotion Complete"
            echo ""
            echo "develop has been promoted to staging at SHA \`${EXPECTED_SHA:0:8}\`."
            echo ""
            echo "- Staging site: https://stage.checklyra.com"
            echo "- MCP server: https://mcp.checklyra.com/health"
            echo "- Vercel deployment verified for this SHA"
          } >> "$GITHUB_STEP_SUMMARY"
