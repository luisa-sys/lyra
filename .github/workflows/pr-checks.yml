name: PR Checks

on:
  pull_request:
    branches: [develop, staging, main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  checks:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0 # KAN-411: full history so the UI/copy-ownership guard can diff against the base branch
      - name: Workflow integrity check (BUGS-4)
        # Static scan of .github/workflows/*.yml for known false-positive
        # patterns (GITHUB_TOKEN+push, --limit 1 deploy verification, 401
        # acceptance without SHA verification). Fails the PR if any
        # workflow re-introduces a banned pattern. See script source for
        # rationale and the # integrity-ok: allow-list mechanism.
        run: bash scripts/check-workflow-integrity.sh
      - name: Action SHA-pinning check (SEC-77 F-22)
        # Static scan of .github/workflows/*.yml: every remote action must be
        # pinned to a full 40-hex commit SHA, never a mutable @tag/@branch.
        # A mutable ref lets upstream change CI code without our review
        # (supply-chain vector). The one-time pin already happened (SEC-20
        # #356); this is the durable regression guard. Exempt local (./)
        # reusables; escape hatch is '# integrity-ok: pin <reason>'.
        run: bash scripts/check-action-pinning.sh
      - name: Server-action export check (BUGS-12)
        # Static scan of every `'use server'` file in src/ for non-async
        # exports. Next.js 16+ rejects these at action-invocation time
        # (build does NOT catch it), so without this guard a regression
        # ships green and breaks every form on the affected page.
        run: bash scripts/check-server-action-exports.sh
      - name: Service-role client centralisation check (KAN-352)
        # Static scan forbidding any call to env.supabaseServiceRoleKey()
        # outside src/lib/supabase-service.ts. The service-role client
        # bypasses all RLS; centralising its construction in one hardened
        # factory means a hardening change lands once, not ~30 times.
        # Allow-list with # service-role-ok: <reason>.
        run: bash scripts/check-service-role-client.sh
      - name: Routine ownership guard (KAN-361)
        # Static scan asserting the "one concern → one owner" markers from the
        # KAN-361 routine de-dup are still present — e.g. weekly-report.yml
        # Section 1 reads health-check.yml (liveness owner) instead of
        # re-curling, and security-audit.yml stays a demoted belt-and-braces
        # audit deferring to the Daily Security routine. Fails the PR if an
        # edit silently re-introduces the quadruplicated probing the ticket
        # removed. Owner map: docs/OPS_ROUTINES_CONTROL_ROOM.md.
        run: bash scripts/check-routine-ownership.sh
      - name: Doc mirror-manifest presence check (KAN-363)
        # Parses the mirror manifest in docs/DOC_SOURCE_OF_TRUTH.md and fails
        # the PR if any critical runbook/compliance doc listed there as a
        # repo mirror has been deleted or renamed out of the tree — the
        # cheapest form of doc drift. Presence only; content drift-vs-wiki is
        # a separate founder/ops-gated leg of KAN-363.
        run: bash scripts/check-doc-mirror-manifest.sh
      - name: Doc mirror-content check (KAN-363)
        # Companion to the presence check above: fails the PR if a listed .md
        # mirror EXISTS but is an empty / stub / heading-less file — the
        # "backup that looks successful but contains placeholder content"
        # failure mode (KAN-167). Structural checks only (non-empty, has a
        # heading, has substance); content drift-vs-wiki stays a separate
        # founder/ops-gated leg of KAN-363.
        run: bash scripts/check-doc-mirror-content.sh
      - name: CODEOWNERS single-source-of-truth check (SEC-3)
        # GitHub uses only the first CODEOWNERS it finds (.github/ > root >
        # docs/) and silently ignores the rest, so two CODEOWNERS files means
        # the lower-precedence one's ownership rules are dead. This guard fails
        # the PR if more than one exists (or none, or the winning file has no
        # default `* @owner`). See SEC-3 / GOV-01.
        run: bash scripts/check-codeowners-single.sh
      - name: UI/copy founder-ownership guard (KAN-411)
        # Machine backstop for "LOOK AND TEXT belong to Luisa". If a PR changes a
        # founder-owned UI/copy path — src/app/**/*.tsx (except src/app/admin/**),
        # src/components/**, globals.css/design tokens, public/ brand assets, and the
        # named copy modules — it must carry a `UI-Change-Approved: <KEY>` (Luisa-
        # initiated) or `UI-Bugfix-Only: <KEY>` (text/rendering-error fix) commit
        # trailer, else the PR fails. Mirrors the Backlog Autopilot protected-surface
        # list so guard and robot agree. Fail-open ONLY when the diff base can't be
        # resolved (CODEOWNERS still hard-gates these paths). See KAN-411.
        run: BASE_REF="origin/${{ github.base_ref }}" bash scripts/check-ui-copy-ownership.sh
      - name: macOS Finder-duplicate file check (KAN-357)
        # Reject any committed " <n>"-suffixed file/dir (e.g. "[slug] 2/" or
        # "profile-sections 2.cjs"). These Finder-copy duplicates shadow the
        # canonical module, are never imported, and confuse audits. Fails the
        # PR if any tracked path carries the suffix. Allow-list in the script.
        run: bash scripts/check-macos-duplicate-files.sh
      - name: Auto-heal pattern catalogue self-test (KAN-63 Tier 4)
        # Verify every entry in scripts/auto-fix-patterns.json still
        # matches its fixture under tests/fixtures/auto-fix-logs/, and
        # that no pattern's regex false-positives on a sibling fixture
        # in the same workflow. This is the regression guard that
        # prevents the auto-fix workflow from silently breaking when
        # someone edits a pattern.
        run: python3 scripts/auto-fix-known-failures.py --self-test
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run type check
        run: npm run type-check
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true
      - name: Run npm audit (high/critical vulnerabilities block PR)
        run: npm audit --audit-level=high
      - name: Check for lint/type bypasses without Jira reference
        run: |
          set -euo pipefail
          echo "Scanning for eslint-disable, ts-ignore, ts-nocheck, ts-expect-error..."
          VIOLATIONS=""
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            linenum=$(echo "$line" | cut -d: -f2)
            content=$(echo "$line" | cut -d: -f3-)
            # Check if the line contains a KAN- reference (tracked tech debt)
            if ! echo "$content" | grep -q "KAN-"; then
              VIOLATIONS="$VIOLATIONS\n  $file:$linenum:$content"
            fi
          done < <(grep -rn "eslint-disable\|@ts-ignore\|@ts-nocheck\|@ts-expect-error" src/ --include="*.ts" --include="*.tsx" || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found lint/type bypasses without Jira ticket reference:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Each bypass must include a KAN-XX reference (e.g. // eslint-disable-next-line -- KAN-99: reason)"
            exit 1
          else
            echo "No untracked lint/type bypasses found."
          fi
      - name: Check architecture doc freshness
        run: |
          set -euo pipefail
          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          
          # Check if any key files changed
          KEY_CHANGE=false
          echo "$CHANGED" | grep -qE "^(src/app/|src/middleware|supabase/migrations/|\.github/workflows/|public/\.well-known/|scripts/)" && KEY_CHANGE=true
          
          # If key files changed, check if ARCHITECTURE.md was also updated
          if [ "$KEY_CHANGE" = true ]; then
            if ! echo "$CHANGED" | grep -q "docs/ARCHITECTURE.md"; then
              echo "::warning::Key source files changed without updating docs/ARCHITECTURE.md. Please review if the architecture document needs updating."
            else
              echo "Architecture doc updated alongside source changes — good."
            fi
          else
            echo "No key architectural files changed — skipping check."
          fi