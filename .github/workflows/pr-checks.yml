name: PR Checks

on:
  pull_request:
    # SEC-101: `beta` was missing from this list, so a PR targeting beta ran NO
    # quality gate at all — the promotion chain's last stop before production
    # was its least-checked branch. Promotions normally reach beta through
    # promote-staging-to-beta.yml rather than a PR, but "normally" is not a
    # control. Listing every branch in the chain means there is no ungated
    # route into production.
    branches: [develop, staging, beta, main]

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  checks:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0 # KAN-411: full history so the UI/copy-ownership guard can diff against the base branch
      - name: Workflow integrity check (BUGS-4)
        # Static scan of .github/workflows/*.yml for known false-positive
        # patterns (GITHUB_TOKEN+push, --limit 1 deploy verification, 401
        # acceptance without SHA verification). Fails the PR if any
        # workflow re-introduces a banned pattern. See script source for
        # rationale and the # integrity-ok: allow-list mechanism.
        run: bash scripts/check-workflow-integrity.sh
      - name: Action SHA-pinning check (SEC-77 F-22)
        # Static scan of .github/workflows/*.yml: every remote action must be
        # pinned to a full 40-hex commit SHA, never a mutable @tag/@branch.
        # A mutable ref lets upstream change CI code without our review
        # (supply-chain vector). The one-time pin already happened (SEC-20
        # #356); this is the durable regression guard. Exempt local (./)
        # reusables; escape hatch is '# integrity-ok: pin <reason>'.
        run: bash scripts/check-action-pinning.sh
      - name: Server-action export check (BUGS-12)
        # Static scan of every `'use server'` file in src/ for non-async
        # exports. Next.js 16+ rejects these at action-invocation time
        # (build does NOT catch it), so without this guard a regression
        # ships green and breaks every form on the affected page.
        run: bash scripts/check-server-action-exports.sh
      - name: Service-role client centralisation check (KAN-352)
        # Static scan forbidding any call to env.supabaseServiceRoleKey()
        # outside src/lib/supabase-service.ts. The service-role client
        # bypasses all RLS; centralising its construction in one hardened
        # factory means a hardening change lands once, not ~30 times.
        # Allow-list with # service-role-ok: <reason>.
        run: bash scripts/check-service-role-client.sh
      - name: Routine ownership guard (KAN-361)
        # Static scan asserting the "one concern → one owner" markers from the
        # KAN-361 routine de-dup are still present — e.g. weekly-report.yml
        # Section 1 reads health-check.yml (liveness owner) instead of
        # re-curling, and security-audit.yml stays a demoted belt-and-braces
        # audit deferring to the Daily Security routine. Fails the PR if an
        # edit silently re-introduces the quadruplicated probing the ticket
        # removed. Owner map: docs/OPS_ROUTINES_CONTROL_ROOM.md.
        run: bash scripts/check-routine-ownership.sh
      - name: Doc mirror-manifest presence check (KAN-363)
        # Parses the mirror manifest in docs/DOC_SOURCE_OF_TRUTH.md and fails
        # the PR if any critical runbook/compliance doc listed there as a
        # repo mirror has been deleted or renamed out of the tree — the
        # cheapest form of doc drift. Presence only; content drift-vs-wiki is
        # a separate founder/ops-gated leg of KAN-363.
        run: bash scripts/check-doc-mirror-manifest.sh
      - name: Doc mirror-content check (KAN-363)
        # Companion to the presence check above: fails the PR if a listed .md
        # mirror EXISTS but is an empty / stub / heading-less file — the
        # "backup that looks successful but contains placeholder content"
        # failure mode (KAN-167). Structural checks only (non-empty, has a
        # heading, has substance); content drift-vs-wiki stays a separate
        # founder/ops-gated leg of KAN-363.
        run: bash scripts/check-doc-mirror-content.sh
      - name: CODEOWNERS single-source-of-truth check (SEC-3)
        # GitHub uses only the first CODEOWNERS it finds (.github/ > root >
        # docs/) and silently ignores the rest, so two CODEOWNERS files means
        # the lower-precedence one's ownership rules are dead. This guard fails
        # the PR if more than one exists (or none, or the winning file has no
        # default `* @owner`). See SEC-3 / GOV-01.
        run: bash scripts/check-codeowners-single.sh
      - name: UI/copy founder-ownership guard (KAN-411)
        # Machine backstop for "LOOK AND TEXT belong to Luisa". If a PR changes a
        # founder-owned UI/copy path — src/app/**/*.tsx (except src/app/admin/**),
        # src/components/**, globals.css/design tokens, public/ brand assets, and the
        # named copy modules — it must carry a `UI-Change-Approved: <KEY>` (Luisa-
        # initiated) or `UI-Bugfix-Only: <KEY>` (text/rendering-error fix) commit
        # trailer, else the PR fails. Mirrors the Backlog Autopilot protected-surface
        # list so guard and robot agree. Fail-open ONLY when the diff base can't be
        # resolved (CODEOWNERS still hard-gates these paths). See KAN-411.
        run: BASE_REF="origin/${{ github.base_ref }}" bash scripts/check-ui-copy-ownership.sh
      - name: Extraction Definition-of-Done (KAN-428)
        # Guard #13. INERT unless the PR deletes or renames a file under src/
        # (an "extraction"). When it fires, every artefact that classifies a
        # file BY PATH must have moved with it in the same PR: the signup
        # manifest, CODEOWNERS, the shell guards' path lists, stryker's mutate
        # globs, docs/, modules.json and tests/. A glob that matches nothing
        # protects nothing while CI stays green — KAN-419 measured the docs
        # layer at 18% dead path literals BEFORE anyone moved a file on
        # purpose. It also requires the PR body to answer the two couplings CI
        # can never see (~/lyra-design-system/build.py and the claude.ai
        # routine prompts, neither in any repo CI can read) plus the covering
        # Playwright project / soak clause.
        #
        # Fails CLOSED (exit 2) when it cannot verify — unresolvable diff base,
        # missing artefact, or an extraction PR with no readable body. Stricter
        # than KAN-411's UI guard on purpose: that one has CODEOWNERS
        # underneath it, this one is the gate that protects the other gates.
        # Escape hatch: `EXTRACTION-DOD-OK: <JIRA-KEY> <check-id>` on a commit,
        # suppressing exactly one named check, printed on every run and counted.
        # See docs/MODULARISATION_EXTRACTION_DOD.md.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: BASE_REF="origin/${{ github.base_ref }}" bash scripts/check-extraction-dod.sh
      - name: Guard-path-drift check (KAN-414 F1)
        # Guard #12, and the companion to #13 above. Where the DoD gate looks at
        # THIS PR's diff, this one audits the WHOLE registry on every run: every
        # path pattern in all 18 registered artefacts must match at least one
        # TRACKED file. A pattern that matches nothing does not fail — it
        # silently protects nothing while the gate keeps reporting green, which
        # is the SEC-79 shape.
        #
        # Tracked files, not the filesystem: a pattern matching only an
        # untracked or gitignored file must FAIL, because CI checks out tracked
        # content and the pattern would be inert there.
        #
        # Proven by mutation (KAN-414): moving src/lib/supabase-service.ts into
        # a module — literally D1's work — disarms TWO controls at once, the
        # signup E2E gate and the service-role containment. Before this guard
        # that move was green.
        #
        # Fails CLOSED (exit 2) when an artefact is missing or unparseable.
        # Escape hatch: `guard-path-ok: <JIRA-KEY> <reason>` on the pattern's
        # own line, suppressing exactly one pattern, printed on every run and
        # counted. Artefacts whose syntax forbids comments (package.json)
        # declare theirs in the script's DECLARED_EXCEPTIONS.
        run: python3 scripts/check-guard-path-drift.py
      - name: Env-access ratchet (KAN-414 F8)
        # 49 distinct environment variables are read from 38 files under src/,
        # and src/lib/env.ts — the module built to be the single resolver — sees
        # almost none of them. A missing variable therefore surfaces as
        # `undefined` deep inside a request instead of failing loudly at boot,
        # and no module can state its own configuration surface.
        #
        # This does NOT migrate anything. It freezes the existing 72 references
        # as a baseline and makes the set SHRINK-ONLY: a new file, or a new
        # variable in an already-listed file, fails; and so does a listed file
        # or variable that has STOPPED being read, because a baseline that only
        # grows is a suppression list.
        #
        # The precedent is why this is a gate and not a refactor:
        # src/lib/deploy-env.ts was created to be the single environment
        # resolver, and all six of the derivations it was meant to replace are
        # still inline. Creating the module is 10% of the work; retiring the
        # call sites and preventing new ones is the other 90%, and only CI does
        # the 90%.
        #
        # Fails closed (exit 2) if the baseline is missing or unparseable.
        # Escape hatch: `// env-access-ok: <JIRA-KEY> <reason>`.
        run: python3 scripts/check-env-access.py
      - name: macOS Finder-duplicate file check (KAN-357)
        # Reject any committed " <n>"-suffixed file/dir (e.g. "[slug] 2/" or
        # "profile-sections 2.cjs"). These Finder-copy duplicates shadow the
        # canonical module, are never imported, and confuse audits. Fails the
        # PR if any tracked path carries the suffix. Allow-list in the script.
        run: bash scripts/check-macos-duplicate-files.sh
      - name: Partial-write safety check (BUGS-74 generalised)
        # The "partial read, whole-row write" data-loss class. An action that
        # filters a caller-supplied record through an allowlist and writes it
        # must treat `undefined` as "not provided" (omit the key), never as
        # "clear this" (write NULL). Getting that wrong destroyed members'
        # Manual-of-Me text on all four environments (BUGS-74); BUGS-70 and
        # BUGS-73 are the same family. Function-scoped, not file-scoped — a
        # guard in a sibling function must not launder an unguarded writer.
        # Runs its own fixture self-test first so the detector cannot rot into
        # a vacuous pass. Allow-list: `// partial-write-ok: <reason>`.
        run: |
          set -euo pipefail
          python3 scripts/check-partial-write-safety.py --self-test
          python3 scripts/check-partial-write-safety.py
      - name: Suspension-guard coverage (SEC-100)
        # Lyra's second-most recurrent security class: a suspension predicate
        # added to one call site while its siblings stay bare (SEC-44, 47, 57,
        # 58, 80, 81, 83, 84, 85, BUGS-21). The RLS policy on `profiles` does
        # enforce is_published AND NOT is_suspended — but the SERVICE-ROLE
        # client bypasses RLS and ~40 modules use it, which is exactly how
        # search + sitemap were still exposing suspended members three weeks
        # after SEC-44 closed. The invariant is stated on the QUERY, not the
        # file or the client, so it enumerates the surface rather than sampling
        # it. Allow-list: `// suspension-guard-ok: <reason>`.
        run: |
          set -euo pipefail
          python3 scripts/check-suspension-guard-coverage.py --self-test
          python3 scripts/check-suspension-guard-coverage.py
      - name: Migration privilege check (SEC-101)
        # Postgres grants EXECUTE to PUBLIC on every new function, and CREATE OR
        # REPLACE RESETS the ACL to that default — which is why revoking EXECUTE
        # has regressed nine times (SEC-12/15/27/28/29/42/43, BUGS-48/65/69).
        # Every migration must carry its own REVOKE, pin search_path on any
        # SECURITY DEFINER function, never GRANT to anon, and enable RLS on any
        # new public table. Ratcheted against
        # supabase/migration-privileges-baseline.json: the 21 pre-existing
        # violations are grandfathered and that list may only shrink.
        # The live counterpart is scripts/check-db-invariants.py.
        run: |
          set -euo pipefail
          python3 scripts/check-migration-privileges.py --self-test
          python3 scripts/check-migration-privileges.py
      - name: Database-invariant waiver hygiene (SEC-101)
        # The waiver file is a control surface in its own right: a waiver with
        # no expiry, no owner or no ticket is an unbounded exception. This also
        # self-tests the live checker's waiver logic, so the expiry mechanism
        # cannot silently stop failing. (The live DB assertion itself needs
        # service-role credentials and runs in db-invariants.yml, not here.)
        run: |
          set -euo pipefail
          python3 scripts/check-db-invariants.py --self-test
          python3 scripts/check-waiver-hygiene.py
      - name: Workflow secret-reference check (SEC-102)
        # GitHub expands an UNDEFINED secret to the empty string, silently — no
        # warning, no annotation, no failed step. deploy-dev.yml had been passing
        # two non-existent secrets into `npm run build`, so its "Verify build"
        # step was building against a blank Supabase config and still passing.
        # Every `secrets.X` must be in .github/known-secrets.txt (generated
        # verbatim from `gh secret list`) or in .github/absent-secrets.txt with a
        # reason AND a Jira key — because not every absence is a defect, but an
        # absence nobody is tracking is not a decision either.
        run: |
          set -euo pipefail
          python3 scripts/check-workflow-secret-refs.py --self-test
          python3 scripts/check-workflow-secret-refs.py
      - name: Control registry integrity (SEC-101)
        # The meta-control. controls/registry.json is the durable memory of the
        # Defect Feedback Loop — which control stops which defect class, and
        # which historical tickets it would have caught. This fails if a
        # registered control's file is missing, if nothing actually invokes it
        # (the SEC-79 "disabled for weeks while reporting green" mode), or if a
        # check script exists in the repo but was never registered. See
        # docs/DEFECT_FEEDBACK_LOOP.md.
        run: |
          set -euo pipefail
          python3 scripts/check-control-registry.py --self-test
          python3 scripts/check-control-registry.py
      - name: Auto-heal pattern catalogue self-test (KAN-63 Tier 4)
        # Verify every entry in scripts/auto-fix-patterns.json still
        # matches its fixture under tests/fixtures/auto-fix-logs/, and
        # that no pattern's regex false-positives on a sibling fixture
        # in the same workflow. This is the regression guard that
        # prevents the auto-fix workflow from silently breaking when
        # someone edits a pattern.
        run: python3 scripts/auto-fix-known-failures.py --self-test
      - name: Bash 3.2 portability check (BUGS-76)
        # macOS ships bash 3.2; CI ships bash 5. A bash-4 builtin in
        # scripts/ therefore works here and exits 127 on the machine where
        # releases are prepared. That is how the SEC-77 auto-promote gate
        # became unrunnable locally — all seven of its tests failed on macOS
        # while passing on ubuntu-latest, which trains the reader to ignore a
        # red suite. staging-soak.sh has documented the rule since it was
        # written and two scripts shipped with mapfile anyway; a convention
        # without a gate erodes. Workflow YAML is out of scope by design —
        # inline run: blocks only ever execute on the runner.
        run: |
          set -euo pipefail
          python3 scripts/check-bash-portability.py --self-test
          python3 scripts/check-bash-portability.py
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Run type check
        run: npm run type-check
      - name: Dependency-rule gate (KAN-425)
        # Three structural rules from .dependency-cruiser.cjs: nothing under
        # src/lib/** may import src/app/**; one top-level src/app segment may
        # not import another; no import cycles. Landing them now stops the
        # codebase regressing while the modularisation programme (KAN-415)
        # runs — the precedent is src/lib/deploy-env.ts, built to be the single
        # environment resolver, which never displaced the six inline
        # derivations because nothing stopped new ones being written.
        #
        # Placed after `npm ci` because dependency-cruiser is a dev-dependency.
        #
        # ROLL-OUT: severity `warn` — violations are printed and annotated, the
        # build stays green. Flip to blocking by changing DEPCRUISE_SEVERITY to
        # `error` once the outstanding findings are cleared (they are KAN-424
        # Defects 2 and 3 plus two more found by this gate; see docs/RUNBOOK.md
        # → "Dependency-rule gate (KAN-425)"). That variable is the ONLY
        # intended change — never relax a rule's definition to make it pass.
        #
        # Fails closed: if dependency-cruiser cannot run (missing/unparseable
        # config, missing binary), the step fails rather than passing quietly.
        run: DEPCRUISE_SEVERITY=warn bash scripts/check-dependency-rules.sh
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true
      - name: Run npm audit (high/critical vulnerabilities block PR)
        run: npm audit --audit-level=high
      - name: Check for lint/type bypasses without Jira reference
        run: |
          set -euo pipefail
          echo "Scanning for eslint-disable, ts-ignore, ts-nocheck, ts-expect-error..."
          VIOLATIONS=""
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            linenum=$(echo "$line" | cut -d: -f2)
            content=$(echo "$line" | cut -d: -f3-)
            # Check if the line contains a KAN- reference (tracked tech debt)
            if ! echo "$content" | grep -q "KAN-"; then
              VIOLATIONS="$VIOLATIONS\n  $file:$linenum:$content"
            fi
          done < <(grep -rn "eslint-disable\|@ts-ignore\|@ts-nocheck\|@ts-expect-error" src/ --include="*.ts" --include="*.tsx" || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found lint/type bypasses without Jira ticket reference:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Each bypass must include a KAN-XX reference (e.g. // eslint-disable-next-line -- KAN-99: reason)"
            exit 1
          else
            echo "No untracked lint/type bypasses found."
          fi
      - name: Check architecture doc freshness
        run: |
          set -euo pipefail
          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          
          # Check if any key files changed
          KEY_CHANGE=false
          echo "$CHANGED" | grep -qE "^(src/app/|src/middleware|supabase/migrations/|\.github/workflows/|public/\.well-known/|scripts/)" && KEY_CHANGE=true
          
          # If key files changed, check if ARCHITECTURE.md was also updated
          if [ "$KEY_CHANGE" = true ]; then
            if ! echo "$CHANGED" | grep -q "docs/ARCHITECTURE.md"; then
              echo "::warning::Key source files changed without updating docs/ARCHITECTURE.md. Please review if the architecture document needs updating."
            else
              echo "Architecture doc updated alongside source changes — good."
            fi
          else
            echo "No key architectural files changed — skipping check."
          fi