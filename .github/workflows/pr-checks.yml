name: PR Checks

on:
  pull_request:
    # SEC-101: `beta` was missing from this list, so a PR targeting beta ran NO
    # quality gate at all — the promotion chain's last stop before production
    # was its least-checked branch. Promotions normally reach beta through
    # promote-staging-to-beta.yml rather than a PR, but "normally" is not a
    # control. Listing every branch in the chain means there is no ungated
    # route into production.
    branches: [develop, staging, beta, main]

defaults:
  run:
    shell: bash

permissions:
  contents: read
  # CTL-042 reads /actions/workflows to learn each workflow's STATE, which is
  # the one fact about a workflow that does not live in the repository. Read-only.
  actions: read

jobs:
  checks:
    name: PR Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0 # KAN-411: full history so the UI/copy-ownership guard can diff against the base branch
      - name: Workflow integrity check (BUGS-4)
        # Static scan of .github/workflows/*.yml for known false-positive
        # patterns (GITHUB_TOKEN+push, --limit 1 deploy verification, 401
        # acceptance without SHA verification). Fails the PR if any
        # workflow re-introduces a banned pattern. See script source for
        # rationale and the # integrity-ok: allow-list mechanism.
        run: bash scripts/check-workflow-integrity.sh
      - name: Action SHA-pinning check (SEC-77 F-22)
        # Static scan of .github/workflows/*.yml: every remote action must be
        # pinned to a full 40-hex commit SHA, never a mutable @tag/@branch.
        # A mutable ref lets upstream change CI code without our review
        # (supply-chain vector). The one-time pin already happened (SEC-20
        # #356); this is the durable regression guard. Exempt local (./)
        # reusables; escape hatch is '# integrity-ok: pin <reason>'.
        run: bash scripts/check-action-pinning.sh
      - name: Server-action export check (BUGS-12)
        # Static scan of every `'use server'` file in src/ for non-async
        # exports. Next.js 16+ rejects these at action-invocation time
        # (build does NOT catch it), so without this guard a regression
        # ships green and breaks every form on the affected page.
        run: bash scripts/check-server-action-exports.sh
      - name: Service-role client centralisation check (KAN-352)
        # Static scan forbidding any call to env.supabaseServiceRoleKey()
        # outside src/modules/platform/supabase-service.ts. The service-role client
        # bypasses all RLS; centralising its construction in one hardened
        # factory means a hardening change lands once, not ~30 times.
        # Allow-list with # service-role-ok: <reason>.
        run: bash scripts/check-service-role-client.sh
      - name: Routine ownership guard (KAN-361)
        # Static scan asserting the "one concern → one owner" markers from the
        # KAN-361 routine de-dup are still present — e.g. weekly-report.yml
        # Section 1 reads health-check.yml (liveness owner) instead of
        # re-curling, and security-audit.yml stays a demoted belt-and-braces
        # audit deferring to the Daily Security routine. Fails the PR if an
        # edit silently re-introduces the quadruplicated probing the ticket
        # removed. Owner map: docs/OPS_ROUTINES_CONTROL_ROOM.md.
        run: bash scripts/check-routine-ownership.sh
      - name: Doc mirror-manifest presence check (KAN-363)
        # Parses the mirror manifest in docs/DOC_SOURCE_OF_TRUTH.md and fails
        # the PR if any critical runbook/compliance doc listed there as a
        # repo mirror has been deleted or renamed out of the tree — the
        # cheapest form of doc drift. Presence only; content drift-vs-wiki is
        # a separate founder/ops-gated leg of KAN-363.
        run: bash scripts/check-doc-mirror-manifest.sh
      - name: Doc mirror-content check (KAN-363)
        # Companion to the presence check above: fails the PR if a listed .md
        # mirror EXISTS but is an empty / stub / heading-less file — the
        # "backup that looks successful but contains placeholder content"
        # failure mode (KAN-167). Structural checks only (non-empty, has a
        # heading, has substance); content drift-vs-wiki stays a separate
        # founder/ops-gated leg of KAN-363.
        run: bash scripts/check-doc-mirror-content.sh
      - name: Ops-heartbeat page-id guard (BUGS-81, CTL-061)
        # Two Confluence Control Rooms are trivially confusable. 33554434 is
        # the Backlog Autopilot Control Room, which has a "Run ledger" section
        # of its own; the ops-routines Heartbeat / Run-ledger table that the
        # routine-watchdog reads lives on the other one, 34275370.
        # A doc pointing the heartbeat at the autopilot page makes the watchdog
        # either
        # report UNVERIFIED for every routine or misread the autopilot's rows as
        # heartbeats (a false PASS from the one control that detects a silently
        # dead routine). Fails both on a WRONG page id and on an ABSENT one.
        run: python3 scripts/check-heartbeat-page-id.py
      - name: Ops-heartbeat page-id guard self-test (CTL-061)
        # A guard whose matcher has never been seen to fire is indistinguishable
        # from no guard. Runs the pinned fixtures, including the one-line
        # repoint that defeated this control's first cut.
        run: python3 scripts/check-heartbeat-page-id.py --self-test
      - name: CODEOWNERS single-source-of-truth check (SEC-3)
        # GitHub uses only the first CODEOWNERS it finds (.github/ > root >
        # docs/) and silently ignores the rest, so two CODEOWNERS files means
        # the lower-precedence one's ownership rules are dead. This guard fails
        # the PR if more than one exists (or none, or the winning file has no
        # default `* @owner`). See SEC-3 / GOV-01.
        run: bash scripts/check-codeowners-single.sh
      - name: UI/copy founder-ownership guard (KAN-411)
        # Machine backstop for "LOOK AND TEXT belong to Luisa". If a PR changes a
        # founder-owned UI/copy path — src/app/**/*.tsx (except src/app/admin/**),
        # src/components/**, globals.css/design tokens, public/ brand assets, and the
        # named copy modules — it must carry a `UI-Change-Approved: <KEY>` (Luisa-
        # initiated) or `UI-Bugfix-Only: <KEY>` (text/rendering-error fix) commit
        # trailer, else the PR fails. Mirrors the Backlog Autopilot protected-surface
        # list so guard and robot agree. Fail-open ONLY when the diff base can't be
        # resolved (CODEOWNERS still hard-gates these paths). See KAN-411.
        run: BASE_REF="origin/${{ github.base_ref }}" bash scripts/check-ui-copy-ownership.sh
      - name: Documentation Definition-of-Done (CTL-047)
        # Guard #14. INERT unless the PR makes a STRUCTURAL change whose meaning
        # is written down: a file added/removed under src/modules/, a workflow
        # added/removed, a control script or the control registry, a migration,
        # or a path-keyed guard manifest. When it fires, the PR must either touch
        # a doc (docs/**, CLAUDE.md, README.md, modules.json, controls/registry.json)
        # or carry a `Docs-Updated: <KEY> <what>` / `Docs-N/A: <KEY> <why>` trailer.
        #
        # The trigger set is deliberately NARROW. A gate that fires on every PR is
        # one people learn to wave through, and that reflex defeats every other
        # gate too. Editing a function body is not in scope; adding a module is.
        #
        # Built after a 2026-08-10 audit found the modularisation plan still
        # saying "No file moves into src/modules/" with 44 files already moved —
        # a fresh session reading it would have stopped approved, shipped work.
        # Docs are part of "done" (KAN-359); this is the first thing enforcing it.
        # Fails CLOSED (exit 2) if the diff base cannot be resolved.
        run: python3 scripts/check-docs-updated.py "origin/${{ github.base_ref }}" HEAD
      - name: Extraction Definition-of-Done (KAN-428)
        # Guard #13. INERT unless the PR deletes or renames a file under src/
        # (an "extraction"). When it fires, every artefact that classifies a
        # file BY PATH must have moved with it in the same PR: the signup
        # manifest, CODEOWNERS, the shell guards' path lists, stryker's mutate
        # globs, docs/, modules.json and tests/. A glob that matches nothing
        # protects nothing while CI stays green — KAN-419 measured the docs
        # layer at 18% dead path literals BEFORE anyone moved a file on
        # purpose. It also requires the PR body to answer the two couplings CI
        # can never see (~/lyra-design-system/build.py and the claude.ai
        # routine prompts, neither in any repo CI can read) plus the covering
        # Playwright project / soak clause.
        #
        # Fails CLOSED (exit 2) when it cannot verify — unresolvable diff base,
        # missing artefact, or an extraction PR with no readable body. Stricter
        # than KAN-411's UI guard on purpose: that one has CODEOWNERS
        # underneath it, this one is the gate that protects the other gates.
        # Escape hatch: `EXTRACTION-DOD-OK: <JIRA-KEY> <check-id>` on a commit,
        # suppressing exactly one named check, printed on every run and counted.
        # See docs/MODULARISATION_EXTRACTION_DOD.md.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          # The mcp-repo check reads luisa-sys/lyra-mcp-server, which is PUBLIC —
          # so the built-in token suffices and no secret is provisioned. Without
          # this the check exits 2 (fail-closed) rather than passing silently.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: BASE_REF="origin/${{ github.base_ref }}" bash scripts/check-extraction-dod.sh
      - name: Design re-baseline gate (CTL-040, KAN-457)
        # Makes the DoD's design-system attestation load-bearing. That
        # attestation is prose — a human types `done` — because the Claude
        # Design source is in a different, PRIVATE repo this CI cannot read.
        # An attestation satisfied by typing a word is indistinguishable from
        # no control: the comment-satisfied-assertion shape (CTL-039) one layer
        # up. So when a PR MOVES a design-bearing file, design/BASELINE.json's
        # `baseline_ref` must change in the same PR — the claim then rests on a
        # diff rather than a promise.
        #
        # Deliberately narrow: it cannot prove the design system was really
        # re-pointed (CI still cannot read that repo), only that someone opened
        # it and recorded its head. Stating that limit is the point; a control
        # read as broader than it is gets mistaken for coverage.
        # Escape hatch: `Design-Baseline-Ok: <JIRA-KEY> <reason>` — key AND
        # reason both required, printed on every run.
        run: |
          set -euo pipefail
          python3 scripts/check-design-baseline.py --self-test
          BASE_REF="origin/${{ github.base_ref }}" python3 scripts/check-design-baseline.py
      - name: Guard-path-drift check (KAN-414 F1)
        # Guard #12, and the companion to #13 above. Where the DoD gate looks at
        # THIS PR's diff, this one audits the WHOLE registry on every run: every
        # path pattern in all 18 registered artefacts must match at least one
        # TRACKED file. A pattern that matches nothing does not fail — it
        # silently protects nothing while the gate keeps reporting green, which
        # is the SEC-79 shape.
        #
        # Tracked files, not the filesystem: a pattern matching only an
        # untracked or gitignored file must FAIL, because CI checks out tracked
        # content and the pattern would be inert there.
        #
        # Proven by mutation (KAN-414): moving src/modules/platform/supabase-service.ts into
        # a module — literally D1's work — disarms TWO controls at once, the
        # signup E2E gate and the service-role containment. Before this guard
        # that move was green.
        #
        # Fails CLOSED (exit 2) when an artefact is missing or unparseable.
        # Escape hatch: `guard-path-ok: <JIRA-KEY> <reason>` on the pattern's
        # own line, suppressing exactly one pattern, printed on every run and
        # counted. Artefacts whose syntax forbids comments (package.json)
        # declare theirs in the script's DECLARED_EXCEPTIONS.
        run: python3 scripts/check-guard-path-drift.py
      - name: Env-access ratchet (KAN-414 F8)
        # 49 distinct environment variables are read from 38 files under src/,
        # and src/modules/platform/env.ts — the module built to be the single resolver — sees
        # almost none of them. A missing variable therefore surfaces as
        # `undefined` deep inside a request instead of failing loudly at boot,
        # and no module can state its own configuration surface.
        #
        # This does NOT migrate anything. It freezes the existing 72 references
        # as a baseline and makes the set SHRINK-ONLY: a new file, or a new
        # variable in an already-listed file, fails; and so does a listed file
        # or variable that has STOPPED being read, because a baseline that only
        # grows is a suppression list.
        #
        # The precedent is why this is a gate and not a refactor:
        # src/modules/platform/deploy-env.ts was created to be the single environment
        # resolver, and all six of the derivations it was meant to replace are
        # still inline. Creating the module is 10% of the work; retiring the
        # call sites and preventing new ones is the other 90%, and only CI does
        # the 90%.
        #
        # Fails closed (exit 2) if the baseline is missing or unparseable.
        # Escape hatch: `// env-access-ok: <JIRA-KEY> <reason>`.
        run: python3 scripts/check-env-access.py
      - name: Schema-drift ratchet (KAN-414 F6)
        # The three Supabase projects do NOT have identical schemas (KAN-420):
        # prod lacks the KAN-153 columns, the KAN-143 `draft` label and two
        # functions; dev lacks BUGS-62's claimed_at. The app compiles against
        # dev, so TypeScript actively asserts prod has columns it does not —
        # a deliberate, documented trade that means the type system cannot be
        # the control here. This gate is.
        #
        # Diffs the three committed schemas as SEMANTIC FACTS (column, enum
        # label, function) rather than lines: the generator wraps a 5-label
        # union and inlines a 4-label one, so a line diff reports 16
        # differences for the single fact "prod is missing `draft`". Noise is
        # how a gate earns the right to be ignored.
        #
        # The baseline is SHRINK-ONLY. New drift fails; so does a baseline
        # entry that has STOPPED drifting, because a list you may only add to
        # is a suppression list, not a ratchet. Fails closed (exit 2) if a
        # schema file or the baseline is missing or unparseable.
        #
        # It deliberately does NOT regenerate from Supabase: that needs
        # credentials CI does not have, and a step that skips when a secret is
        # absent is the silent-skip pattern KAN-167 forbids. Regeneration is a
        # documented manual step.
        run: python3 scripts/check-schema-type-parity.py
      - name: Live schema-parity checker self-test (CTL-048)
        # The checker itself, exercised without credentials. Its LIVE run lives
        # in promote-to-staging.yml, where the secrets are — but if the
        # comparators rot, every environment would report clean for the wrong
        # reason, and that must fail here rather than during a promotion.
        run: python3 scripts/check-live-schema-parity.py --self-test
      - name: Migration ledger-parity checker self-test (CTL-049)
        # Same split as CTL-048 above: the LIVE run needs a Management API
        # token and lives in db-invariants.yml, but the comparison and the
        # two-way ratchet are pure logic and must be proven to still fail here.
        # The normaliser is the part that matters — it collapses the repo's
        # `profile_items_visibility` onto the ledger's
        # `kan_143_profile_items_visibility`, and one that collapsed too much
        # would MASK an unrebuildable migration while reporting green.
        run: python3 scripts/check-migration-ledger-parity.py --self-test
      - name: Snapshot-regeneration checker self-test (CTL-071)
        # SEC-151. Same split again: the LIVE run regenerates from three
        # databases and lives in db-invariants.yml; the comparison is pure
        # logic and must be proven to still fail here.
        #
        # What matters in these fixtures is the NORMALISATION. It collapses
        # exactly one thing — trailing whitespace at end of file, because the
        # CLI and the Supabase MCP generator disagree about the final newline
        # and a control red on all three environments over a blank line is one
        # somebody switches off. A normaliser that collapsed any more than
        # that would hide real schema drift while reporting green, so the
        # fixtures pin both directions: EOF whitespace is not drift, a blank
        # line INSIDE the file is.
        run: python3 scripts/check-snapshot-regeneration.py --self-test
      - name: macOS Finder-duplicate file check (KAN-357)
        # Reject any committed " <n>"-suffixed file/dir (e.g. "[slug] 2/" or
        # "profile-sections 2.cjs"). These Finder-copy duplicates shadow the
        # canonical module, are never imported, and confuse audits. Fails the
        # PR if any tracked path carries the suffix. Allow-list in the script.
        run: bash scripts/check-macos-duplicate-files.sh
      - name: Partial-write safety check (BUGS-74 generalised)
        # The "partial read, whole-row write" data-loss class. An action that
        # filters a caller-supplied record through an allowlist and writes it
        # must treat `undefined` as "not provided" (omit the key), never as
        # "clear this" (write NULL). Getting that wrong destroyed members'
        # Manual-of-Me text on all four environments (BUGS-74); BUGS-70 and
        # BUGS-73 are the same family. Function-scoped, not file-scoped — a
        # guard in a sibling function must not launder an unguarded writer.
        # Runs its own fixture self-test first so the detector cannot rot into
        # a vacuous pass. Allow-list: `// partial-write-ok: <reason>`.
        run: |
          set -euo pipefail
          python3 scripts/check-partial-write-safety.py --self-test
          python3 scripts/check-partial-write-safety.py
      - name: Suspension-guard coverage (SEC-100)
        # Lyra's second-most recurrent security class: a suspension predicate
        # added to one call site while its siblings stay bare (SEC-44, 47, 57,
        # 58, 80, 81, 83, 84, 85, BUGS-21). The RLS policy on `profiles` does
        # enforce is_published AND NOT is_suspended — but the SERVICE-ROLE
        # client bypasses RLS and ~40 modules use it, which is exactly how
        # search + sitemap were still exposing suspended members three weeks
        # after SEC-44 closed. The invariant is stated on the QUERY, not the
        # file or the client, so it enumerates the surface rather than sampling
        # it. Allow-list: `// suspension-guard-ok: <reason>`.
        run: |
          set -euo pipefail
          python3 scripts/check-suspension-guard-coverage.py --self-test
          python3 scripts/check-suspension-guard-coverage.py
      - name: Migration privilege check (SEC-101)
        # Postgres grants EXECUTE to PUBLIC on every new function, and CREATE OR
        # REPLACE RESETS the ACL to that default — which is why revoking EXECUTE
        # has regressed nine times (SEC-12/15/27/28/29/42/43, BUGS-48/65/69).
        # Every migration must carry its own REVOKE, pin search_path on any
        # SECURITY DEFINER function, never GRANT to anon, and enable RLS on any
        # new public table. Ratcheted against
        # supabase/migration-privileges-baseline.json: the 21 pre-existing
        # violations are grandfathered and that list may only shrink.
        # The live counterpart is scripts/check-db-invariants.py.
        run: |
          set -euo pipefail
          python3 scripts/check-migration-privileges.py --self-test
          python3 scripts/check-migration-privileges.py
      - name: Database-invariant waiver hygiene (SEC-101)
        # The waiver file is a control surface in its own right: a waiver with
        # no expiry, no owner or no ticket is an unbounded exception. This also
        # self-tests the live checker's waiver logic, so the expiry mechanism
        # cannot silently stop failing. (The live DB assertion itself needs
        # service-role credentials and runs in db-invariants.yml, not here.)
        run: |
          set -euo pipefail
          python3 scripts/check-db-invariants.py --self-test
          python3 scripts/check-waiver-hygiene.py
      - name: Workflow secret-reference check (SEC-102)
        # GitHub expands an UNDEFINED secret to the empty string, silently — no
        # warning, no annotation, no failed step. deploy-dev.yml had been passing
        # two non-existent secrets into `npm run build`, so its "Verify build"
        # step was building against a blank Supabase config and still passing.
        # Every `secrets.X` must be in .github/known-secrets.txt (generated
        # verbatim from `gh secret list`) or in .github/absent-secrets.txt with a
        # reason AND a Jira key — because not every absence is a defect, but an
        # absence nobody is tracking is not a decision either.
        run: |
          set -euo pipefail
          python3 scripts/check-workflow-secret-refs.py --self-test
          python3 scripts/check-workflow-secret-refs.py
      - name: Absent-secret ledger has a live probe (SEC-158 / CTL-068)
        # The check above is ONE-DIRECTIONAL: it fails when a workflow names a
        # secret in neither ledger, and never asks whether a recorded ABSENCE is
        # still real. So an entry saying "this does not exist" passed forever
        # once the secret was provisioned — SUPABASE_ACCESS_TOKEN sat there
        # under 20 lines of confident, false prose while CTL-049 was quietly
        # green, pointing anyone triaging a red run at the wrong job entirely.
        #
        # `${{ secrets[NAME] }}` cannot be indexed dynamically, so the probe is
        # GENERATED with one literal per entry. This step asserts the generated
        # workflow still matches the ledger; the probe itself runs weekly and
        # is what actually catches an absence that has ended.
        run: |
          set -euo pipefail
          python3 scripts/check-absent-secret-probe.py --self-test
          python3 scripts/check-absent-secret-probe.py
      - name: Soak verdicts are extracted and testable (BUGS-103 / CTL-069)
        # BUGS-103: the C1-sitemap-fresh probe asserted a header Next hardcodes
        # to the OTHER value, so it could never return PASS and could not have
        # caught SEC-100 — the defect it existed for. It shipped red and stayed
        # red four days.
        #
        # Two things made that possible. The instrument did not vary with the
        # property (only measurement could catch that), and the decision was
        # INLINE bash reachable by no test — so nothing could observe that its
        # PASS branch was unreachable. This gates the second.
        #
        # Shrink-only and two-way: a NEW inline verdict fails, and a baselined
        # one that has been extracted fails as STALE. Extraction is credited
        # only when the classifier has a test asserting BOTH verdicts —
        # otherwise "extract it" is a way to leave the baseline for free.
        run: |
          set -euo pipefail
          python3 scripts/check-soak-classifier-coverage.py --self-test
          python3 scripts/check-soak-classifier-coverage.py
      - name: Control registry integrity (SEC-101)
        # The meta-control. controls/registry.json is the durable memory of the
        # Defect Feedback Loop — which control stops which defect class, and
        # which historical tickets it would have caught. This fails if a
        # registered control's file is missing, if nothing actually invokes it
        # (the SEC-79 "disabled for weeks while reporting green" mode), or if a
        # check script exists in the repo but was never registered. See
        # docs/DEFECT_FEEDBACK_LOOP.md.
        run: |
          set -euo pipefail
          python3 scripts/check-control-registry.py --self-test
          python3 scripts/check-control-registry.py
      - name: Scheduled workflows are actually ACTIVE (CTL-042, SEC-79 family)
        # A DISABLED workflow still has a perfect file on disk. Every other
        # check in this repo reasons about .github/workflows/*.yml as TEXT -
        # the step above confirms a control's file exists and that something
        # invokes it - and all of them pass for a workflow GitHub will never
        # run again, because `state: disabled_manually` lives in the API and
        # nowhere in the repository.
        #
        # Found 2026-08-09: 4 of the 20 workflows declaring a cron schedule
        # were inactive and had been since mid-June, including anomaly-detect
        # on */15. Dependabot kept bumping all four (#474), so they kept
        # appearing in diffs looking maintained.
        #
        # WARN-ONLY until the four are re-enabled or excepted - same warn->block
        # path as the KAN-413 signup gate. Blocking now would fail every
        # unrelated PR pending a founder-only decision, and a gate that blocks
        # work nobody can unblock is a gate that gets switched off. Flip via
        # SCHEDULED_WORKFLOW_GATE_ENFORCE=1.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # FLIPPED TO BLOCKING 2026-08-09. It shipped warn-only because four
          # workflows were dark pending a founder decision, and a gate that
          # blocks every unrelated PR on something nobody can clear is a gate
          # that gets switched off. That decision is made: two re-enabled, two
          # excepted with reasons. Nothing is left unaccounted for, so the
          # warn->block path completes here.
          SCHEDULED_WORKFLOW_GATE_ENFORCE: '1'
        run: |
          set -euo pipefail
          python3 scripts/check-scheduled-workflows-active.py --self-test
          python3 scripts/check-scheduled-workflows-active.py
      - name: Required checks are still satisfiable (CTL-066, SEC-106)
        # A required status check is a STRING. GitHub stores the context name a
        # branch demands and never verifies that anything still produces it, so
        # renaming main-chain-guard.yml's `guard` job un-gates SEC-98 production
        # change control with no error anywhere: protection keeps waiting for a
        # check nothing reports, and the PR is admin-merged and forgotten.
        #
        # ONLY THE --local ARM RUNS HERE, and blocking from day one is safe
        # because it is decided entirely by the diff: it compares the contexts
        # in .github/expected-protection.json against the jobs this repo
        # defines, needs no credentials, and passes on develop today.
        #
        # The --live arm (does GitHub's actual configuration match the file?)
        # runs on a SCHEDULE in required-checks.yml, not here. A pull request
        # cannot change branch protection, so it would answer nothing in the PR
        # gate while putting a third-party API on the merge path - the shape
        # that froze the pipeline ~11 days under SEC-88 (gotcha #23).
        run: |
          set -euo pipefail
          python3 scripts/check-required-checks.py --self-test
          python3 scripts/check-required-checks.py --local
      - name: Shared-code drift across repos (CTL-043, KAN-418)
        # content-moderation.ts and moderation-policy.ts exist as COPIES in
        # lyra AND lyra-mcp-server, with nothing checking they still agree.
        # KAN-418 offered publishing @lyra/contracts instead; that was declined
        # 2026-08-09 ("minimise the supply chain surface") because a private
        # package consumed by the web app and both Railway services becomes a
        # path where whoever can publish executes in production in three places.
        #
        # This costs zero tokens: lyra-mcp-server is PUBLIC, so the built-in
        # GITHUB_TOKEN reads it. It does not remove the duplication, it removes
        # the silence.
        #
        # moderation-policy.ts was ALREADY textually drifted when this landed
        # (different headers + the NodeNext '.js' extension) with identical
        # logic - which is why that entry compares NORMALISED. A byte check
        # would have been red on day one for a reason nobody can fix.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/check-shared-code-drift.py --self-test
          python3 scripts/check-shared-code-drift.py
      - name: Auto-heal pattern catalogue self-test (KAN-63 Tier 4)
        # Verify every entry in scripts/auto-fix-patterns.json still
        # matches its fixture under tests/fixtures/auto-fix-logs/, and
        # that no pattern's regex false-positives on a sibling fixture
        # in the same workflow. This is the regression guard that
        # prevents the auto-fix workflow from silently breaking when
        # someone edits a pattern.
        run: python3 scripts/auto-fix-known-failures.py --self-test
      - name: Bash 3.2 portability check (BUGS-76)
        # macOS ships bash 3.2; CI ships bash 5. A bash-4 builtin in
        # scripts/ therefore works here and exits 127 on the machine where
        # releases are prepared. That is how the SEC-77 auto-promote gate
        # became unrunnable locally — all seven of its tests failed on macOS
        # while passing on ubuntu-latest, which trains the reader to ignore a
        # red suite. staging-soak.sh has documented the rule since it was
        # written and two scripts shipped with mapfile anyway; a convention
        # without a gate erodes. Workflow YAML is out of scope by design —
        # inline run: blocks only ever execute on the runner.
        run: |
          set -euo pipefail
          python3 scripts/check-bash-portability.py --self-test
          python3 scripts/check-bash-portability.py
      - name: CTL-038 - tests must not reimplement their subject
        # BUGS-85: tests/unit/maintenance-page.test.js reported 19 passing tests
        # for the public maintenance page's email form and asserted nothing about
        # it - it re-declared the worker's own isValidEmail and rate limiter in
        # the test file and tested those copies. Stubbing the WORKER's
        # validation, its rate limiting and its HTML escaping each left all 19
        # green. Worse than no tests: 19 passing tests read as coverage.
        # Shrink-only ratchet - a NEW or WORSENED finding fails, and so does a
        # baselined one that has been fixed, because a list you may only add to
        # is a suppression list.
        run: |
          set -euo pipefail
          python3 scripts/check-test-reimplementation.py --self-test
          python3 scripts/check-test-reimplementation.py
      - name: CTL-039 - a scan must not be satisfied by a comment
        # KAN-440. A source-text assertion passes if the string exists anywhere
        # in the file, comments included. SEC-100 ran live while
        # toContain('is_published') was green, and at
        # dashboard/profile/page.tsx:27 the comment was written to satisfy the
        # scan - deleting all three real data-fetch lines leaves 11/11 green.
        # Gates the modularisation: KAN-415 moves files, and such a guard
        # follows the prose rather than the code.
        run: |
          set -euo pipefail
          python3 scripts/check-comment-only-assertions.py --self-test
          python3 scripts/check-comment-only-assertions.py
      - name: CTL-077 - source-scanning tests may not grow
        # KAN-356 web-tests-06. CTL-038 and CTL-039 catch two vacuous SHAPES;
        # neither classifies a test as grep-vs-behavioural, and neither bounds
        # how many exist. scripts/triage-source-text-tests.py already did the
        # classification and was triage - it printed a report and nothing
        # invoked it, so the number could only go up. This gate imports that
        # same classifier (never a second copy) and ratchets it per file.
        # TWO-WAY: a new or grown count fails, and so does a baselined count
        # that has been improved, because a list you may only add to is a
        # suppression list. Only the convertible bucket is counted - a scan
        # proving absence or migration content cannot be observed at runtime,
        # so "converting" it would prove less.
        run: |
          set -euo pipefail
          python3 scripts/check-source-scan-inventory.py --self-test
          python3 scripts/check-source-scan-inventory.py
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        # CTL-046 lives in eslint.config.mjs — a no-restricted-syntax rule scoped
        # to the access gates. Naming the config here is what connects the
        # control to its invoker in controls/registry.json; `npm run lint` alone
        # reaches it only by convention, and a convention is precisely what the
        # registry exists to stop us relying on.
        run: npm run lint  # uses eslint.config.mjs
      - name: Run type check
        run: npm run type-check
      - name: Dependency-rule gate (KAN-425)
        # Three structural rules from .dependency-cruiser.cjs: nothing under
        # src/lib/** may import src/app/**; one top-level src/app segment may
        # not import another; no import cycles. Landing them now stops the
        # codebase regressing while the modularisation programme (KAN-415)
        # runs — the precedent is src/modules/platform/deploy-env.ts, built to be the single
        # environment resolver, which never displaced the six inline
        # derivations because nothing stopped new ones being written.
        #
        # Placed after `npm ci` because dependency-cruiser is a dev-dependency.
        #
        # ⚠️ `DEPCRUISE_SEVERITY=warn` DOES NOT MAKE THIS STEP NON-BLOCKING.
        # This comment used to read "the build stays green", which has been
        # FALSE since KAN-414 F3 (2026-07-29) replaced the single global dial
        # with per-rule severity. `FORCE_ERROR` is a one-way override, so a rule
        # measured at zero violations resolves to `error` regardless of the env
        # var: no-module-to-app and no-circular BLOCK today. Only
        # no-cross-segment-app is genuinely warn, because 2 violations remain.
        #
        # Proven by mutation 2026-08-14 rather than by reading the config: a
        # src/modules/platform → src/app/globals.css import under this exact
        # invocation exits 1 with `error no-module-to-app`.
        #
        # Left as `warn` deliberately — it is the value that keeps the one
        # unfinished rule advisory while the two finished ones block. Never
        # relax a rule's definition to make it pass.
        #
        # Fails closed: if dependency-cruiser cannot run (missing/unparseable
        # config, missing binary), the step fails rather than passing quietly.
        run: DEPCRUISE_SEVERITY=warn bash scripts/check-dependency-rules.sh
      - name: Module layering policy (CTL-051)
        # KAN-415 C2, the layering half. modules.json declares a layer per
        # module and an explicit layerPolicy — "edge src->dst allowed iff
        # layer(dst) < layer(src) OR dst in declaredSameLayer[src]; upward edges
        # FORBIDDEN ABSOLUTELY" — and until now NOTHING read any of it. All 21
        # modules carried "enforced": false and no script consumed that field,
        # so the manifest described an architecture rather than constraining
        # one. Measured when this landed: 62 cross-module edges, 12 violating.
        #
        # Not a dependency-cruiser rule: the policy is a function of two JSON
        # fields across 21 modules, which as depcruise regexes would be ~400
        # generated pairwise rules that go stale on every layer change. Reading
        # the manifest keeps one source of truth; depcruise still produces the
        # graph.
        #
        # Two-way ratchet on modules-layering-baseline.json — a NEW violation
        # fails, and so does a baselined one that has been FIXED. Fails closed
        # (exit 2) if the manifest, graph or baseline cannot be read.
        run: |
          set -euo pipefail
          python3 scripts/check-module-layering.py --self-test
          python3 scripts/check-module-layering.py
          python3 scripts/check-module-api.py --self-test
          python3 scripts/check-module-api.py
          python3 scripts/check-edge-safe.py --self-test
          python3 scripts/check-edge-safe.py
          # CTL-055. The three checks above constrain the IMPORT graph; this one
          # constrains the DATA graph, and they are not the same boundary.
          # Convene is the proof: it passes CTL-051 and CTL-053 cleanly — 2
          # declared entry points, every outward edge legal and downward — and
          # still reaches 3 tables owned by other modules. `modules.json` has
          # carried `owns.tables` since it was written and nothing read it.
          python3 scripts/check-module-table-ownership.py --self-test
          python3 scripts/check-module-table-ownership.py
          # CTL-056. `app-routes-are-thin` — the last of the nine rules KAN-415
          # criterion 2 names, and the only one never built, because "thin" was
          # never defined. Defined now as a shrink-only ratchet on direct
          # database calls inside request entry points: 48 of 99 route files,
          # 217 calls at landing. Not "zero calls" — that is a 48-file
          # relocation, exactly the work criterion 3 concluded was unnecessary,
          # and a rule that reddens 48 files on day one is a rule someone turns
          # off. Per file, not a total, so one file improving cannot mask
          # another regressing.
          python3 scripts/check-route-thinness.py --self-test
          python3 scripts/check-route-thinness.py
          # CTL-064 / SEC-99. SEC-98 forbids pushing directly to main/beta/
          # staging, and until now that rule existed only in CLAUDE.md while the
          # repo shipped two scripts that did exactly it — six direct pushes,
          # three of them --force onto main. A documented convention with no
          # gate erodes (the gotcha #28 lesson). Scans every TRACKED file under
          # scripts/ with no extension filter: SEC-99's own §1 called those
          # scripts unreferenced on the strength of a grep over
          # *.md/*.yml/*.json/*.sh, and missed docs/lyra-project-reference.jsx.
          # .github/workflows/ is out of scope by design — the promote workflows
          # push to release branches because that IS the supervised path, and
          # CTL-016 already governs them.
          python3 scripts/check-release-branch-push.py --self-test
          python3 scripts/check-release-branch-push.py
      - name: Run unit tests
        run: npm run test:unit
        env:
          CI: true
      # SEC-105. Scoped to the production dependency tree and waiver-aware.
      # This is now the ONLY blocking npm audit in the estate — the four deploy
      # workflows re-audited a lockfile this step had already passed, adding no
      # information and a spontaneous-failure window on the release path.
      # The full tree is still audited weekly by security-audit.yml, which
      # raises a ticket rather than blocking.
      - name: npm audit — production tree (high/critical block the PR)
        run: |
          set -euo pipefail
          python3 scripts/check-npm-audit-gate.py --self-test
          python3 scripts/check-npm-audit-gate.py --scope prod
      - name: Check for lint/type bypasses without Jira reference
        run: |
          set -euo pipefail
          echo "Scanning for eslint-disable, ts-ignore, ts-nocheck, ts-expect-error..."
          VIOLATIONS=""
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            linenum=$(echo "$line" | cut -d: -f2)
            content=$(echo "$line" | cut -d: -f3-)
            # Check if the line contains a KAN- reference (tracked tech debt)
            if ! echo "$content" | grep -q "KAN-"; then
              VIOLATIONS="$VIOLATIONS\n  $file:$linenum:$content"
            fi
          done < <(grep -rn "eslint-disable\|@ts-ignore\|@ts-nocheck\|@ts-expect-error" src/ --include="*.ts" --include="*.tsx" || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found lint/type bypasses without Jira ticket reference:"
            echo -e "$VIOLATIONS"
            echo ""
            echo "Each bypass must include a KAN-XX reference (e.g. // eslint-disable-next-line -- KAN-99: reason)"
            exit 1
          else
            echo "No untracked lint/type bypasses found."
          fi
      - name: Check architecture doc freshness
        run: |
          set -euo pipefail
          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          
          # Check if any key files changed
          KEY_CHANGE=false
          echo "$CHANGED" | grep -qE "^(src/app/|src/middleware|src/modules/|supabase/migrations/|\.github/workflows/|public/\.well-known/|scripts/)" && KEY_CHANGE=true
          
          # If key files changed, check if ARCHITECTURE.md was also updated
          if [ "$KEY_CHANGE" = true ]; then
            if ! echo "$CHANGED" | grep -q "docs/ARCHITECTURE.md"; then
              echo "::warning::Key source files changed without updating docs/ARCHITECTURE.md. Please review if the architecture document needs updating."
            else
              echo "Architecture doc updated alongside source changes — good."
            fi
          else
            echo "No key architectural files changed — skipping check."
          fi