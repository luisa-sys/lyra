name: CodeQL Security Analysis
on:
  # SEC-101: `beta` was missing here while beta's branch protection REQUIRES the
  # "CodeQL Analysis" check. A required check that can never run is an
  # unsatisfiable gate, and the only way past it is an admin override — so the
  # override became the normal path onto the branch that shares the PRODUCTION
  # database. Same omission was fixed in pr-checks.yml (PR #594).
  push:
    branches: [develop, staging, beta, main]
  pull_request:
    branches: [develop, staging, beta, main]
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 03:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:javascript-typescript"
