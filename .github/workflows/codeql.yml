name: CodeQL Security Analysis
on:
  # SEC-101: `beta` was missing here while beta's branch protection REQUIRES the
  # "CodeQL Analysis" check. A required check that can never run is an
  # unsatisfiable gate, and the only way past it is an admin override — so the
  # override became the normal path onto the branch that shares the PRODUCTION
  # database. Same omission was fixed in pr-checks.yml (PR #594).
  push:
    branches: [develop, staging, beta, main]
  pull_request:
    branches: [develop, staging, beta, main]
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 03:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          category: "/language:javascript-typescript"
