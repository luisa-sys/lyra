version: 2
updates:
  # Every ecosystem below targets develop so its PRs flow through the
  # standard develop → staging → beta → main pipeline (SEC-98: main is
  # reached ONLY via that chain, never a PR — main-chain-guard.yml blocks
  # any PR based on main outright). CLAUDE.md gotcha #1 ("workflow changes
  # only take effect once on main") is still true, but it argues for WHEN a
  # workflow bump takes effect, not for WHERE its PR is based — a bump
  # entering at develop still reaches main via the normal promote chain,
  # just one promote cycle later. See BUGS-79.
  #
  # SEC-197 (2026-11-23) — dependency freshness policy, docs/DEPENDENCY_POLICY.md:
  # anything vulnerable (any severity) or >90 days old with a newer release is
  # upgraded on develop. Weekly cadence for both ecosystems keeps every bump far
  # inside that 90-day window; minor/patch are grouped, majors come singly (they
  # are still in policy — a major upgrade is still an upgrade). The daily
  # `freshness` job in security-audit.yml (CTL-081) catches anything Dependabot
  # misses or that sits unmerged.
  #
  # ⚠️ SEC-190: `target-branch` governs VERSION updates only. GitHub always opens
  # Dependabot SECURITY updates against the default branch (main), where
  # main-chain-guard.yml blocks every PR. Policy answer: such a PR is a signal,
  # not a route — the same upgrade lands on develop (via the matching version
  # update below, or by hand), is promoted through the chain, and the
  # main-targeted PR is then closed. Never merge it.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Group react/react-dom (+ @types) so they always bump together.
    # react-dom@X peer-depends on react@^X and package.json pins exact
    # versions — solo react-dom bumps fail install (see PR #91).
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Bundle the remaining minor/patch bumps so Dependabot opens a couple of
      # grouped PRs per week instead of ~14 individual ones (KAN-406). Majors are
      # excluded via update-types, so a breaking bump still gets its own PR for
      # review (e.g. eslint 9→10, jose 5→6 need code changes).
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
    # One grouped PR for GitHub Actions bumps instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"