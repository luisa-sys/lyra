version: 2
updates:
  # npm deps target develop so they flow through the standard
  # develop → staging → main pipeline. Workflow-file bumps below
  # (github-actions ecosystem) still target main since workflow
  # changes only take effect once on main (CLAUDE.md gotcha #1).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    # Group react/react-dom (+ @types) so they always bump together.
    # react-dom@X peer-depends on react@^X and package.json pins exact
    # versions — solo react-dom bumps fail install (see PR #91).
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # Bundle the remaining minor/patch bumps so Dependabot opens a couple of
      # grouped PRs per week instead of ~14 individual ones (KAN-406). Majors are
      # excluded via update-types, so a breaking bump still gets its own PR for
      # review (e.g. eslint 9→10, jose 5→6 need code changes).
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
    # One grouped PR for GitHub Actions bumps instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"