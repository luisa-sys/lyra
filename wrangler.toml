# Cloudflare Workers configuration for Lyra maintenance page
# Deployed by .github/workflows/lyra-maintenance-deploy.yml (repo-owned
# `wrangler deploy`, on push to main, path-filtered to this file + the worker).
# BUGS-19 replaced the Cloudflare Workers Builds Git integration with this
# workflow — see CLAUDE.md gotcha #20.
# See: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Secrets:
#   RESEND_API_KEY — signup notification emails; a *worker* secret set in the
#     Cloudflare dashboard (`wrangler secret put`), NOT a GitHub/CI secret.
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID — GitHub Actions secrets read
#     by the deploy workflow so `wrangler deploy` can authenticate.

name = "lyra-maintenance"
main = "scripts/lyra-maintenance-worker.js"
compatibility_date = "2024-12-01"

# KV namespace binding for interest email signups
[[kv_namespaces]]
binding = "INTEREST_EMAILS"
id = "c7bdc8624f0a4bd5b0a8ad36e9f93d96"

# Routes are managed in the Cloudflare dashboard, not here.
# Current route: checklyra.com/* → this worker
